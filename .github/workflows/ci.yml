name: VenQore CI Pipeline

on:
  push:
    branches: [ main, master, dev, feature/* ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  php-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app-code/main-app

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: amd_pos_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for trailing NUL-byte corruption
        run: |
          git ls-files | grep -E '\.(php|json|js|jsx|md|yml|yaml)$' | while read -r file; do
            if [ -f "$file" ] && [ -s "$file" ]; then
              python3 -c "
          import sys, os
          f = sys.argv[1]
          with open(f, 'rb') as fh:
              fh.seek(-1, 2)
              if fh.read(1) == b'\x00':
                  print(f'Error: Trailing NUL byte found in {f}')
                  sys.exit(1)
          " "$file"
            fi
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath, zip, gd, pdo_mysql
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --prefer-dist

      - name: Setup Environment
        run: |
          cp .env.ci .env
          php artisan key:generate

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Audit Mass Assignment
        run: php artisan audit:mass-assignment

      - name: Run PHP Tests
        run: composer test:ci

  js-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app-code/main-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint "resources/js/**/*.{js,jsx}" --quiet || true

      - name: Build Production Bundle
        run: npm run build

  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  design-system:
    name: Design conformance
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app-code/main-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-code/main-app/package-lock.json

      - name: Install
        run: npm ci

      # The token CSS is the single source for every design value. This proves
      # the generated theme still matches it — a hand-edit to
      # themes/venqore-v6.js or theme.generated.css shows up here as a diff.
      - name: Theme is generated, not hand-edited
        run: |
          npm run theme:sync
          if ! git diff --quiet -- resources/js/theme/themes/venqore-v6.js resources/css/theme.generated.css; then
            echo "::error::The generated theme does not match resources/css/venqore-v6/tokens/."
            echo "Someone edited a generated file by hand. Edit the token CSS and run 'npm run theme:sync'."
            git diff --stat -- resources/js/theme/themes/venqore-v6.js resources/css/theme.generated.css
            exit 1
          fi

      # DESIGN-RULES.md v3.1 §16. Blocking rules are at zero and must stay
      # there; ratchet rules are held at their current count and may only fall.
      - name: Design conformance
        run: ./scripts/design-check.sh

      # A class that does not exist in tailwind.config.js compiles to nothing
      # and the element silently inherits. Building the CSS is what catches it.
      - name: CSS compiles
        run: npx tailwindcss -i resources/css/app.css -o /tmp/app.css --minify
