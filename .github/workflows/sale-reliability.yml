# Sale reliability gate (docs/SALE_RELIABILITY_IMPLEMENTATION.md, package F).
#
# Runs the money suites on the database version production runs (MariaDB
# 10.5) and on PHP 8.3 and 8.4, the float-money lint, the JS money and queue
# suites, and the real-browser IndexedDB queue tests. Make every job here a
# REQUIRED status check on main (Settings → Branches → branch protection):
# a release must not ship while any of them is red.
#
# This file lives at the repository root (.github/workflows); the app is in
# app-code/main-app.

name: Sale reliability

on:
  push:
    branches: [main, master, dev, develop, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sale-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  money-php:
    name: Money suites — PHP ${{ matrix.php }} / MariaDB 10.5
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: amd_pos_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: app-code/main-app
    env:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: amd_pos_test
      DB_USERNAME: root
      DB_PASSWORD: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, bcmath, intl, zip, gd, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: app-code/main-app/vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('app-code/main-app/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Environment
        run: |
          cp .env.ci .env
          php artisan key:generate --force

      - name: The database really is MariaDB 10.5
        run: |
          v=$(mysql -h 127.0.0.1 -uroot -N -e "SELECT VERSION()")
          echo "Server: $v"
          case "$v" in 10.5.*MariaDB*) ;; *) echo "::error::Expected MariaDB 10.5, got $v"; exit 1;; esac

      - run: php artisan migrate --force

      - name: Float-money lint (ratchet)
        run: php scripts/money-float-lint.php

      - name: Money suites
        working-directory: app-code/main-app/tests
        run: |
          php ../vendor/bin/pest -c phpunit.xml --no-coverage --log-junit ../storage/test-results/sale-reliability-${{ matrix.php }}.xml \
            tests/Unit/SaleReliability \
            tests/Feature/SaleReliability \
            tests/Feature/ZeroDrift \
            tests/Feature/Commerce/OnlineOrderReliabilityTest.php \
            tests/Feature/Module05/FinancialEngineTest.php \
            tests/Feature/FiscalYear/FiscalYearTest.php

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sale-reliability-php${{ matrix.php }}
          path: |
            app-code/main-app/storage/test-results/
            app-code/main-app/storage/logs/laravel.log
          retention-days: 14

  money-js:
    name: Money and queue suites — JS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-code/main-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-code/main-app/package-lock.json
      - run: npm ci
      - run: npm run test:sale-reliability
      - run: npx vitest run resources/js/tests

  queue-browser:
    name: Offline queue — real Chromium (IndexedDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-code/main-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-code/main-app/package-lock.json
      - run: npm ci
      # Installed without saving so package.json / package-lock.json stay as they are.
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-reporter=spec verification/sale-reliability/browser/queue.browser.test.mjs
