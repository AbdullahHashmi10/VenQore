name: Deploy VenQore to Production

# L023: Deploy is gated on the test workflows succeeding. Instead of triggering
# directly on push to main (which could deploy code no test ever ran against),
# this workflow runs only after the "VenQore Tests" workflow completes, and the
# job below refuses to proceed unless that run concluded successfully on main.
# workflow_dispatch remains for deliberate manual (emergency) deploys.
on:
  workflow_run:
    workflows: ["VenQore Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:    # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to venqore.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Proceed only when triggered manually, or when the upstream test run
    # both targeted main and passed. This makes it technically impossible to
    # deploy code that has not passed CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. SSH into server and run deploy script ─────────────────
      # Secrets needed in GitHub → Settings → Secrets:
      #   PRODUCTION_HOST      = IP or hostname of your DigitalOcean Droplet
      #   PRODUCTION_USER      = www-data (or deploy user)
      #   PRODUCTION_SSH_KEY   = Private SSH key (generate a deploy key pair)
      #   PRODUCTION_PORT      = 22 (or custom SSH port)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          timeout: 600s
          script: |
            bash /var/www/venqore/deploy/deploy.sh main 2>&1

      # ── 3. Notify on success ────────────────────────────────────
      - name: Deploy success notification
        if: success()
        run: |
          echo "✅ VenQore deployed successfully to production"
          echo "   Commit: ${{ github.sha }}"
          echo "   By: ${{ github.actor }}"

      # ── 4. Notify on failure ────────────────────────────────────
      - name: Deploy failure notification
        if: failure()
        run: |
          echo "❌ VenQore deploy FAILED"
          echo "   Commit: ${{ github.sha }}"
          echo "   Check: https://github.com/AbdullahHashmi10/AMD-Project/actions"
