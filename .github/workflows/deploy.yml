name: Build & Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Vite & Publish to release branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, json
          tools: composer:v2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app-code/main-app/package-lock.json

      - name: Install dependencies & Build Vite
        working-directory: app-code/main-app
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Assemble Standalone Release & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _dist
          cp -r app-code/main-app/. _dist/
          cd _dist
          rm -rf node_modules tests .git .github .vscode
          rm -f .env .env.*
          cp .env.production.example .env.example 2>/dev/null || true
          mkdir -p public/build storage/framework/cache
          echo "$(date +%Y%m%d_%H%M%S)_${GITHUB_SHA:0:8}" > public/build/build_id.txt
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin release || true
          git reset --soft FETCH_HEAD || true
          git add -A
          git commit -m "release: auto-build from commit ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin release
