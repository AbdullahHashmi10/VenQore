name: VenQore Tests

on:
  push:
    branches: ["main", "develop", "release/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} — Feature Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: amd_pos_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]

    defaults:
      run:
        working-directory: app-code/main-app

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── PHP Setup ───────────────────────────────────────────────────────
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: >-
            mbstring, pdo, pdo_mysql, bcmath, ctype,
            fileinfo, json, openssl, tokenizer, xml, zip
          coverage: none   # no Xdebug overhead — coverage runs separately

      # ── Composer Cache ──────────────────────────────────────────────────
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ── Environment ──────────────────────────────────────────────────────
      - name: Copy .env.testing
        run: |
          cp .env.example .env.testing
          echo "APP_ENV=testing"                >> .env.testing
          echo "DB_CONNECTION=mysql"            >> .env.testing
          echo "DB_HOST=127.0.0.1"              >> .env.testing
          echo "DB_PORT=3306"                   >> .env.testing
          echo "DB_DATABASE=amd_pos_test"       >> .env.testing
          echo "DB_USERNAME=root"               >> .env.testing
          echo "DB_PASSWORD="                   >> .env.testing
          echo "CACHE_DRIVER=array"             >> .env.testing
          echo "QUEUE_CONNECTION=sync"          >> .env.testing
          echo "SESSION_DRIVER=array"           >> .env.testing
          echo "MAIL_MAILER=array"              >> .env.testing

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Migrate test DB
        run: php artisan migrate --env=testing --force

      # ── Run Tests ───────────────────────────────────────────────────────
      - name: Run VenQore feature tests (all 20 modules)
        run: |
          php artisan config:clear --env=testing
          vendor/bin/pest \
            tests/tests/Feature/Module01 \
            tests/tests/Feature/Module02 \
            tests/tests/Feature/Module03 \
            tests/tests/Feature/Module04 \
            tests/tests/Feature/Module05 \
            tests/tests/Feature/Module06 \
            tests/tests/Feature/Module07 \
            tests/tests/Feature/Module08 \
            tests/tests/Feature/Module09 \
            tests/tests/Feature/Module10 \
            tests/tests/Feature/Module11 \
            tests/tests/Feature/Module12 \
            tests/tests/Feature/Module13 \
            tests/tests/Feature/Module14 \
            tests/tests/Feature/Module15 \
            tests/tests/Feature/Module16 \
            tests/tests/Feature/Module17 \
            tests/tests/Feature/Module18 \
            tests/tests/Feature/Module19 \
            tests/tests/Feature/Module20 \
            --no-coverage \
            --stop-on-failure
        env:
          APP_ENV: testing

      # ── Failure Artifact ─────────────────────────────────────────────────
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pest-failure-log-php${{ matrix.php }}
          path: app-code/main-app/storage/logs/laravel.log
          retention-days: 7
