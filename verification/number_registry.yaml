# ── CONSISTENCY GROUPS ────────────────────────────────────────────────────────
# Metrics that claim to show the same value across multiple surfaces.
# Phase 6 Consistency Sweep asserts byte-equality across all members of a group.

consistency_groups:
  - id: "CG-001"
    metric: "Total Revenue (current period)"
    surfaces:
      - "DASH-005"   # Dashboard revenue_mtd card
      - "RPT-002"    # P&L revenue line
      - "RPT-007"    # Sales Report total
      - "EXP-001"    # Export of above
    risk: "HIGH — dashboard uses MTD; reports use custom date range; boundary mismatch common"

  - id: "CG-002"
    metric: "Net Profit"
    surfaces:
      - "DASH-007"   # Dashboard net_profit_mtd card
      - "RPT-002"    # P&L net profit line
    risk: "MEDIUM"

  - id: "CG-003"
    metric: "Accounts Receivable total"
    surfaces:
      - "DASH-003"   # Dashboard receivables card (account 1200)
      - "RPT-005"    # Aged Receivables total
      - "STMT-001"   # Customer statement balances (sum)
    risk: "HIGH — AR control must equal sum of all customer open balances"

  - id: "CG-004"
    metric: "Accounts Payable total"
    surfaces:
      - "DASH-004"   # Dashboard payables card (account 2000)
      - "RPT-006"    # Aged Payables total
      - "STMT-002"   # Supplier statement balances (sum)
    risk: "HIGH — AP control must equal sum of all vendor open balances"

  - id: "CG-005"
    metric: "Inventory Asset value"
    surfaces:
      - "RPT-009"    # Inventory Valuation report
      - "RPT-003"    # Balance Sheet inventory line (account 1100)
      - "RPT-001"    # Trial Balance account 1100
    risk: "CRITICAL — three-way tie; any divergence indicates FIFO/ledger mismatch"

  - id: "CG-006"
    metric: "COGS"
    surfaces:
      - "RPT-002"    # P&L COGS line
      - "RPT-010"    # COGS report
      - "RPT-011"    # Gross Profit report (revenue - gross_profit = COGS)
    risk: "HIGH"

