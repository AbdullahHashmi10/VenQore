# ─── Non-PHPUnit verification sources (the sweep / engine layer) ───────────────
# These run as Artisan commands, not test methods. They are wrapped by verify:all
# and contribute to the headline verification count. Each is oracle-classified
# HONESTLY: today most of the sweep layer is T2 (consistency), not T1 (truth).
# Phase G adds the manifest truth-anchor that promotes the Golden-Audit slice to T1.
verification_sources:
  - id: ledger-truth-sweep
    command: "php artisan audit:ledger-truth"
    kind: route-sweep
    description: "Scans all discoverable GET routes; compares on-page financial props against FinancialReportingService."
    oracle_tier: T2   # control values come from the same service powering the pages (blueprint FC-4). Phase G adds a T1 manifest layer for the Golden-Audit tenant.
    approx_verifications: 154
    floor_key: routes_scanned_min

  - id: data-integrity
    command: "php artisan audit:data-integrity"
    kind: invariant-scan
    description: "Double-entry / trial-balance invariants across tenants."
    oracle_tier: T1   # pure ledger invariant (SUM debit == SUM credit) — independent of any report service.
    approx_verifications: 0   # count is dynamic (per-tenant); reported at runtime.

  - id: verify-engines
    command: "php artisan verify:engines"
    kind: engine-analysis
    description: "Ten verification engines consume the ClaimLogger stream (verification_claims.jsonl)."
    oracle_tier: T2
    approx_verifications: 0   # dynamic — one claim per instrumented assertion.

  - id: verify-sentinel
    command: "php artisan verify:sentinel"
    kind: sensitivity-probe
    description: "Seeds marker amounts via a ledger bypass and asserts the sweep detects the divergence (E-12 style)."
    oracle_tier: T1   # detector self-test — pass requires the probe to actually fire.
    approx_verifications: 0

  - id: golden-verify
    command: "php artisan golden:verify"
    kind: manifest-check
    description: "Golden Company manifest reconciliation entry point."
    oracle_tier: T1
    approx_verifications: 0

# Headline reconciliation. phpunit_test_methods_total (759) + the sweep layer
# (~154 route checks + dynamic invariant/engine/sentinel checks) is the basis of
# the ~1,121 figure. The dashboard renders the MEASURED count from the latest Run
# Ledger + sweep artifacts, never a hard-coded number (blueprint §19.2).
headline:
  phpunit_test_methods: 759
  static_sweep_route_checks: 154
  note: "Remaining verifications (invariant/engine/sentinel) are counted at runtime from artifacts, not asserted statically."
