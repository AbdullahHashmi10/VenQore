    type: "sale"
    tenant_id: "TENANT-1"
    date: "2025-01-15"
    customer_id: "CUST-AHMED"
    warehouse_id: "WH-MAIN"
    payment_method: "credit"
    items:
      - product_id: "PROD-PHONE"
        qty: 3
        unit_price: 45000.00
        discount_percent: 10
        tax_rate: 17
    subtotal_gross: 135000.00
    total_item_discounts: 13500.00
    net_sales: 121500.00
    total_tax: 20655.00
    invoice_total: 142155.00
    cogs: 96000.00
    payment_status: "unpaid"
    fifo_batches_consumed:
      - batch_id: "BATCH-PHN-001"
        qty_taken: 3
        unit_cost: 32000.00
        total_cost: 96000.00

  # ────────────────────────────────────────────────────────────────────────────
  # CUSTOMER PAYMENT CP-001 — January 20, 2025
  # Ahmed pays Rs.100,000 against SAL-002 (partial payment)
  # Journal: DR 1000 Cash 100,000 / CR 1200 AR 100,000 (party: Ahmed)
  # Remaining AR from SAL-002: 42,155
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-CP-001"
    type: "customer_payment"
    tenant_id: "TENANT-1"
    date: "2025-01-20"
    customer_id: "CUST-AHMED"
    payment_method: "cash"
    amount: 100000.00
    allocated_to_sale: "TXN-SAL-002"
    description: "Partial payment for INV-SAL-002"
    journal:
      - account_code: "1000"
        debit: 100000.00
        credit: 0
      - account_code: "1200"
        debit: 0
        credit: 100000.00
        party_id: "CUST-AHMED"

  # ────────────────────────────────────────────────────────────────────────────
  # PURCHASE P-003 — February 1, 2025 — Second phone batch (different cost)
  # Buy 5 more Smartphone X10 @ Rs.33,500 each from TechSupply — on credit
  # This creates a second FIFO layer at a DIFFERENT cost (tests FIFO ordering)
  # Subtotal: 167,500. Tax 17%: 28,475. Total: 195,975.
  # FIFO batch: BATCH-PHN-002 @ Rs.33,500/unit × 5
  # Journal: DR 1100 167,500 / DR 2300 28,475 / CR 2000 195,975
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-PUR-003"
    type: "purchase"
    tenant_id: "TENANT-1"
    date: "2025-02-01"
    vendor_id: "VEND-TECH"
    warehouse_id: "WH-MAIN"
    payment_method: "credit"
    reference: "PO-TECH-002"
    items:
      - product_id: "PROD-PHONE"
        qty: 5
        unit_cost: 33500.00
        tax_rate: 17
        batch_id: "BATCH-PHN-002"
    subtotal: 167500.00
    tax_amount: 28475.00
    total: 195975.00
    journal:
      - account_code: "1100"
        debit: 167500.00
        credit: 0
      - account_code: "2300"
        debit: 28475.00
        credit: 0
      - account_code: "2000"
        debit: 0
        credit: 195975.00
        party_id: "VEND-TECH"

  # ────────────────────────────────────────────────────────────────────────────
  # VENDOR PAYMENT VP-001 — February 5, 2025
  # Pay TechSupply Rs.374,400 (full settlement of PUR-001)
  # Journal: DR 2000 AP 374,400 / CR 1000 Cash 374,400
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-VP-001"
    type: "supplier_payment"
    tenant_id: "TENANT-1"
    date: "2025-02-05"
    vendor_id: "VEND-TECH"
    payment_method: "cash"
    amount: 374400.00
    allocated_to_purchase: "TXN-PUR-001"
    description: "Full payment for PO-TECH-001"
    journal:
      - account_code: "2000"
        debit: 374400.00
        credit: 0
        party_id: "VEND-TECH"
      - account_code: "1000"
        debit: 0
        credit: 374400.00

  # ────────────────────────────────────────────────────────────────────────────
  # SALE S-003 — February 10, 2025 — FIFO test: consumes BOTH batches
  # Sell 7 Smartphone X10 to Sara Trading — credit sale, 0% discount, 17% GST
  # FIFO: 5 remaining from BATCH-PHN-001 @ 32,000 + 2 from BATCH-PHN-002 @ 33,500
  # COGS = (5 × 32,000) + (2 × 33,500) = 160,000 + 67,000 = 227,000
  # Net sales: 7 × 45,000 = 315,000. Tax: 53,550. Invoice: 368,550.
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-SAL-003"
    type: "sale"
    tenant_id: "TENANT-1"
    date: "2025-02-10"
    customer_id: "CUST-SARA"
    warehouse_id: "WH-MAIN"
    payment_method: "credit"
    items:
      - product_id: "PROD-PHONE"
        qty: 7
        unit_price: 45000.00
        discount_percent: 0
        tax_rate: 17
    subtotal_gross: 315000.00
    total_item_discounts: 0.00
    net_sales: 315000.00
    total_tax: 53550.00
    invoice_total: 368550.00
    cogs: 227000.00
    payment_status: "unpaid"
    fifo_batches_consumed:
      - batch_id: "BATCH-PHN-001"
        qty_taken: 5
        unit_cost: 32000.00
        total_cost: 160000.00
      - batch_id: "BATCH-PHN-002"
        qty_taken: 2
        unit_cost: 33500.00
        total_cost: 67000.00

  # ────────────────────────────────────────────────────────────────────────────
  # EXPENSE E-001 — February 15, 2025 — Rent
  # Pay rent Rs.50,000 cash for February
  # Journal: DR 5200 Rent Expense 50,000 / CR 1000 Cash 50,000
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-EXP-001"
    type: "expense"
    tenant_id: "TENANT-1"
    date: "2025-02-15"
    category: "Rent"
    description: "February 2025 rent"
    payment_method: "cash"
    amount: 50000.00
    journal:
      - account_code: "5200"
        debit: 50000.00
        credit: 0
      - account_code: "1000"
        debit: 0
        credit: 50000.00

  # ────────────────────────────────────────────────────────────────────────────
  # PURCHASE P-004 — March 1, 2025 — Laptops + Adapters (branch warehouse)
