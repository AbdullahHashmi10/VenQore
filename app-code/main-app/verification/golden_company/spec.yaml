  # Vendor: TechSupply on credit. 17% GST on both.
  # Laptops: 390,000 + tax 66,300 = 456,300
  # Adapters: 6,000 + tax 1,020 = 7,020
  # Total bill: 463,320
  # Batches: BATCH-LPT-001 (3 laptops @ 130,000), BATCH-ADP-001 (5 adapters @ 1,200)
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-PUR-004"
    type: "purchase"
    tenant_id: "TENANT-1"
    date: "2025-03-01"
    vendor_id: "VEND-TECH"
    warehouse_id: "WH-BRANCH"
    payment_method: "credit"
    reference: "PO-TECH-003"
    items:
      - product_id: "PROD-LAPTOP"
        qty: 3
        unit_cost: 130000.00
        tax_rate: 17
        batch_id: "BATCH-LPT-001"
      - product_id: "PROD-ADAPTER"
        qty: 5
        unit_cost: 1200.00
        tax_rate: 17
        batch_id: "BATCH-ADP-001"
    subtotal: 396000.00          # 390000 + 6000
    tax_amount: 67320.00         # 66300 + 1020
    total: 463320.00
    journal:
      - account_code: "1100"
        debit: 396000.00
        credit: 0
      - account_code: "2300"
        debit: 67320.00
        credit: 0
      - account_code: "2000"
        debit: 0
        credit: 463320.00
        party_id: "VEND-TECH"

  # ────────────────────────────────────────────────────────────────────────────
  # SALE S-004 — March 10, 2025 — Sale with 100% discount (promotional)
  # Give 2 USB-C Cables FREE to Ahmed Electronics (promotional)
  # Net sales = 0, Tax = 0, Invoice = 0
  # COGS = 2 × Rs.400 = Rs.800 (FIFO still deducts)
  # Journal: DR 5000 COGS 800 / CR 1100 Inventory 800 (zero revenue entry skipped if 0)
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-SAL-004"
    type: "sale"
    tenant_id: "TENANT-1"
    date: "2025-03-10"
    customer_id: "CUST-AHMED"
    warehouse_id: "WH-MAIN"
    payment_method: "cash"
    amount_received: 0.00
    items:
      - product_id: "PROD-CABLE"
        qty: 2
        unit_price: 800.00
        discount_percent: 100
        tax_rate: 0
        is_promotional: true
    subtotal_gross: 1600.00
    total_item_discounts: 1600.00
    net_sales: 0.00
    total_tax: 0.00
    invoice_total: 0.00
    cogs: 800.00
    payment_status: "paid"
    fifo_batches_consumed:
      - batch_id: "BATCH-CBL-001"
        qty_taken: 2
        unit_cost: 400.00
        total_cost: 800.00

  # ────────────────────────────────────────────────────────────────────────────
  # SALE S-005 — March 15, 2025 — Split payment (part cash, part credit)
  # Sell 1 Laptop to walk-in, Rs.180,000 price, 17% GST, 0% discount
  # Net: 180,000. Tax: 30,600. Invoice: 210,600.
  # Customer pays Rs.150,000 cash; Rs.60,600 goes to AR
  # COGS: 1 × 130,000 = 130,000
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-SAL-005"
    type: "sale"
    tenant_id: "TENANT-1"
    date: "2025-03-15"
    customer_id: "CUST-WALK"
    warehouse_id: "WH-BRANCH"
    payment_method: "split"
    amount_received: 150000.00
    items:
      - product_id: "PROD-LAPTOP"
        qty: 1
        unit_price: 180000.00
        discount_percent: 0
        tax_rate: 17
    subtotal_gross: 180000.00
    total_item_discounts: 0.00
    net_sales: 180000.00
    total_tax: 30600.00
    invoice_total: 210600.00
    cogs: 130000.00
    payment_status: "partial"
    fifo_batches_consumed:
      - batch_id: "BATCH-LPT-001"
        qty_taken: 1
        unit_cost: 130000.00
        total_cost: 130000.00

  # ────────────────────────────────────────────────────────────────────────────
  # SALE RETURN SR-001 — March 20, 2025
  # Ahmed returns the 3 phones from SAL-002 (full reversal)
  # Reverses the journal of SAL-002; restores FIFO batches
  # This is the "refund chain" scenario
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-SR-001"
    type: "sale_return"
    tenant_id: "TENANT-1"
    date: "2025-03-20"
    original_sale_id: "TXN-SAL-002"
    reason: "Customer cancelled order"
    # Reversal restores: BATCH-PHN-001 +3 units back
    # Journal is exact mirror of SAL-002, swapped debit/credit

  # ────────────────────────────────────────────────────────────────────────────
  # EXPENSE E-002 — March 31, 2025 — Utilities
  # Pay electricity bill Rs.15,000 cash
  # Journal: DR 5300 Utilities 15,000 / CR 1000 Cash 15,000
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-EXP-002"
    type: "expense"
    tenant_id: "TENANT-1"
    date: "2025-03-31"
    category: "Utilities"
    description: "March electricity bill"
    payment_method: "cash"
    amount: 15000.00
    journal:
      - account_code: "5300"
        debit: 15000.00
        credit: 0
      - account_code: "1000"
        debit: 0
        credit: 15000.00

  # ────────────────────────────────────────────────────────────────────────────
  # APRIL-JUNE: Strong quarter (peak sales season)
  # Condensed for spec clarity — full detail in manifest
  # ────────────────────────────────────────────────────────────────────────────

  # Purchase of more phones — April batch
  - id: "TXN-PUR-005"
    type: "purchase"
    tenant_id: "TENANT-1"
    date: "2025-04-01"
    vendor_id: "VEND-TECH"
    warehouse_id: "WH-MAIN"
    payment_method: "credit"
    reference: "PO-TECH-004"
    items:
      - product_id: "PROD-PHONE"
        qty: 20
        unit_cost: 34000.00
        tax_rate: 17
        batch_id: "BATCH-PHN-003"
    subtotal: 680000.00
    tax_amount: 115600.00
    total: 795600.00
    journal:
      - account_code: "1100"
        debit: 680000.00
        credit: 0
      - account_code: "2300"
        debit: 115600.00
        credit: 0
      - account_code: "2000"
        debit: 0
        credit: 795600.00
