# ============================================================
# VenQore Golden Company — Transaction Specification
# Phase 1 of the Verification Blueprint
# ============================================================
#
# DOCTRINE: Truth-first authoring.
# Every transaction declared here was computed BEFORE the seeder was
# written. The independent calculator (calculator.php) reads THIS file
# and produces manifest.yaml — the app and the calculator must agree.
#
# DETERMINISM RULES:
#   - All IDs are fixed (never random). Seeder re-runs yield byte-identical DBs.
#   - All timestamps are frozen to the declared date at 00:00:00 Asia/Karachi
#     (via Carbon::setTestNow() in the seeder).
#   - Manifest checksum is stored in manifest.yaml — tests refuse to run
#     if spec_checksum in manifest ≠ SHA256 of this file.
#
# UNIVERSE:
#   Fiscal year: 2025-01-01 → 2025-12-31
#   "Today" frozen at: 2025-12-31 23:59:59 Asia/Karachi
#   Currency: PKR (2 decimal places, round half-up at line level)
#   Tax regime: Simple GST at two rates — 17% and 0%
#   Two tenants: Golden Co (TENANT-1) and Isolation Co (TENANT-2, minimal)
#   Two warehouses: Main (WH-MAIN), Branch (WH-BRANCH)
#   Two branches: Downtown (BR-DOWNTOWN), Uptown (BR-UPTOWN)
#
# ============================================================

spec_version: "1.0"
spec_date: "2025-12-31"
frozen_clock: "2025-12-31 23:59:59"
timezone: "Asia/Karachi"
checksum: "PENDING"  # updated by calculator.php after generation

# ── TENANT DEFINITIONS ────────────────────────────────────────────────────────

tenants:
  - id: "TENANT-1"
    name: "Golden Electronics Co."
    slug: "golden-co"
    currency_code: "PKR"
    currency_symbol: "Rs."
    timezone: "Asia/Karachi"
    plan: "growth"
    role: "primary"   # This is the tenant under test

  - id: "TENANT-2"
    name: "Isolation Tester Ltd."
    slug: "isolation-co"
    currency_code: "PKR"
    currency_symbol: "Rs."
    timezone: "Asia/Karachi"
    plan: "starter"
    role: "isolation"  # Must NEVER leak data into TENANT-1

# ── WAREHOUSES ────────────────────────────────────────────────────────────────

warehouses:
  - id: "WH-MAIN"
    tenant_id: "TENANT-1"
    name: "Main Warehouse"
    location: "Downtown Karachi"
    is_default: true

  - id: "WH-BRANCH"
    tenant_id: "TENANT-1"
    name: "Branch Warehouse"
    location: "Uptown Karachi"
    is_default: false

# ── PARTIES (Customers & Vendors) ─────────────────────────────────────────────

parties:
  # Customers
  - id: "CUST-AHMED"
    tenant_id: "TENANT-1"
    name: "Ahmed Electronics"
    type: "customer"
    credit_limit: 500000.00
    opening_balance: 0.00

  - id: "CUST-SARA"
    tenant_id: "TENANT-1"
    name: "Sara Trading"
    type: "customer"
    credit_limit: 200000.00
    opening_balance: 0.00

  - id: "CUST-WALK"
    tenant_id: "TENANT-1"
    name: "Walk-in Customer"
    type: "customer"
    credit_limit: null
    opening_balance: 0.00

  # Vendors
  - id: "VEND-TECH"
    tenant_id: "TENANT-1"
    name: "TechSupply Co."
    type: "vendor"
    opening_balance: 0.00

  - id: "VEND-ELEC"
    tenant_id: "TENANT-1"
    name: "ElecParts Ltd."
    type: "vendor"
    opening_balance: 0.00

  # Isolation tenant
  - id: "CUST-ISO"
    tenant_id: "TENANT-2"
    name: "Isolation Customer"
    type: "customer"
    opening_balance: 0.00

# ── PRODUCTS ──────────────────────────────────────────────────────────────────
# All products use FIFO costing. Tax rate is line-level.

products:
  - id: "PROD-PHONE"
    tenant_id: "TENANT-1"
    name: "Smartphone X10"
    sku: "GC-PHN-001"
    selling_price: 45000.00
    cost_price: 32000.00     # purchase cost (used for fallback — should not be needed in Golden Co)
    tax_rate: 17             # GST 17%
    track_inventory: true
    track_serial: false
    unit: "pcs"

  - id: "PROD-CABLE"
    tenant_id: "TENANT-1"
    name: "USB-C Cable"
    sku: "GC-CBL-001"
    selling_price: 800.00
    cost_price: 400.00
    tax_rate: 0              # zero-rated
    track_inventory: true
    track_serial: false
    unit: "pcs"

  - id: "PROD-LAPTOP"
    tenant_id: "TENANT-1"
    name: "Laptop Pro 14"
    sku: "GC-LPT-001"
    selling_price: 180000.00
    cost_price: 130000.00
    tax_rate: 17
    track_inventory: true
    track_serial: true       # serial-tracked
    unit: "pcs"

  - id: "PROD-ADAPTER"
    tenant_id: "TENANT-1"
    name: "Power Adapter 65W"
    sku: "GC-ADP-001"
    selling_price: 2500.00
    cost_price: 1200.00
    tax_rate: 17
    track_inventory: true
    track_serial: false
    unit: "pcs"

  # Isolation tenant product — must never appear in TENANT-1 reports
  - id: "PROD-ISO"
    tenant_id: "TENANT-2"
    name: "Isolation Widget"
    sku: "ISO-001"
    selling_price: 1000.00
    cost_price: 500.00
    tax_rate: 0
    track_inventory: true
    track_serial: false
    unit: "pcs"

# ══════════════════════════════════════════════════════════════════════════════
# TRANSACTIONS — ordered chronologically, executed in this exact sequence
# ══════════════════════════════════════════════════════════════════════════════

transactions:

  # ────────────────────────────────────────────────────────────────────────────
  # OPENING BALANCE — January 1, 2025
  # Capital injection: Owner puts Rs. 1,000,000 into the business
  # Journal: DR 1000 Cash 1,000,000 / CR 3000 Owner's Capital 1,000,000
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-OB-001"
    type: "opening_balance"
    tenant_id: "TENANT-1"
    date: "2025-01-01"
    description: "Owner capital injection"
    journal:
      - account_code: "1000"
        debit: 1000000.00
        credit: 0
      - account_code: "3000"
        debit: 0
        credit: 1000000.00

  # ────────────────────────────────────────────────────────────────────────────
  # PURCHASE P-001 — January 5, 2025 — Credit purchase of phones
  # Buy 10 Smartphone X10 @ Rs.32,000 each from TechSupply Co. on credit
  # Total: Rs.320,000 + 17% GST input = Rs.374,400 total bill
  # Journal: DR 1100 Inventory 320,000 / DR 2300 Input Tax 54,400 / CR 2000 AP 374,400
  # FIFO batch created: BATCH-PHN-001 @ Rs.32,000/unit × 10 = Rs.320,000
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-PUR-001"
    type: "purchase"
    tenant_id: "TENANT-1"
    date: "2025-01-05"
    vendor_id: "VEND-TECH"
    warehouse_id: "WH-MAIN"
    payment_method: "credit"
    reference: "PO-TECH-001"
    items:
      - product_id: "PROD-PHONE"
        qty: 10
        unit_cost: 32000.00
        tax_rate: 17
        batch_id: "BATCH-PHN-001"
    # Computed values (for manifest verification):
    subtotal: 320000.00
    tax_amount: 54400.00       # 320000 × 17% = 54400
    total: 374400.00
    journal:
      - account_code: "1100"
        debit: 320000.00
        credit: 0
      - account_code: "2300"   # Input Tax Recoverable
        debit: 54400.00
        credit: 0
      - account_code: "2000"   # AP — TechSupply Co.
        debit: 0
        credit: 374400.00
        party_id: "VEND-TECH"

  # ────────────────────────────────────────────────────────────────────────────
  # PURCHASE P-002 — January 8, 2025 — Cash purchase of cables
  # Buy 50 USB-C Cables @ Rs.400 each from ElecParts — paid in cash
  # Zero-rated GST. Total: Rs.20,000
  # FIFO batch: BATCH-CBL-001 @ Rs.400/unit × 50
  # Journal: DR 1100 Inventory 20,000 / CR 1000 Cash 20,000
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-PUR-002"
    type: "purchase"
    tenant_id: "TENANT-1"
    date: "2025-01-08"
    vendor_id: "VEND-ELEC"
    warehouse_id: "WH-MAIN"
    payment_method: "cash"
    reference: "PO-ELEC-001"
    items:
      - product_id: "PROD-CABLE"
        qty: 50
        unit_cost: 400.00
        tax_rate: 0
        batch_id: "BATCH-CBL-001"
    subtotal: 20000.00
    tax_amount: 0.00
    total: 20000.00
    journal:
      - account_code: "1100"
        debit: 20000.00
        credit: 0
      - account_code: "1000"
        debit: 0
        credit: 20000.00

  # ────────────────────────────────────────────────────────────────────────────
  # SALE S-001 — January 10, 2025 — Cash sale of 2 phones to walk-in
  # Sell 2 Smartphone X10 @ Rs.45,000 each. Zero discount. 17% GST.
  # Net sales = 90,000. Tax = 15,300. Invoice total = 105,300.
  # COGS: 2 × Rs.32,000 = Rs.64,000 (from BATCH-PHN-001 → FIFO)
  # Journal:
  #   DR 1000 Cash 105,300
  #   CR 4000 Revenue 90,000
  #   CR 2100 Tax Payable 15,300
  #   DR 5000 COGS 64,000
  #   CR 1100 Inventory 64,000
  # ────────────────────────────────────────────────────────────────────────────

  - id: "TXN-SAL-001"
    type: "sale"
    tenant_id: "TENANT-1"
    date: "2025-01-10"
    customer_id: "CUST-WALK"
    warehouse_id: "WH-MAIN"
    payment_method: "cash"
    amount_received: 105300.00
    items:
      - product_id: "PROD-PHONE"
        qty: 2
        unit_price: 45000.00
        discount_percent: 0
        tax_rate: 17
    # Computed:
    subtotal_gross: 90000.00
    total_item_discounts: 0.00
    net_sales: 90000.00
    total_tax: 15300.00
    invoice_total: 105300.00
    cogs: 64000.00
    payment_status: "paid"
    fifo_batches_consumed:
      - batch_id: "BATCH-PHN-001"
        qty_taken: 2
        unit_cost: 32000.00
        total_cost: 64000.00

  # ────────────────────────────────────────────────────────────────────────────
  # SALE S-002 — January 15, 2025 — Credit sale to Ahmed Electronics
  # Sell 3 Smartphone X10 @ Rs.45,000 each. 10% trade discount. 17% GST.
  # Gross: 135,000. Discount: 13,500. Net: 121,500. Tax: 20,655. Total: 142,155.
  # COGS: 3 × Rs.32,000 = Rs.96,000
  # Journal:
  #   DR 1200 AR 142,155  (party: Ahmed)
  #   CR 4000 Revenue 121,500
  #   CR 2100 Tax Payable 20,655
  #   DR 5000 COGS 96,000
  #   CR 1100 Inventory 96,000
  # ────────────────────────────────────────────────────────────────────────────

