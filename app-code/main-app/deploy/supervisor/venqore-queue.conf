[program:venqore-queue]
process_name=%(program_name)s
command=php /var/www/venqore/app-code/main-app/artisan queue:work database --sleep=3 --tries=3 --timeout=120 --queue=provisioning,emails,webhooks,heavy,growth,low,default
directory=/var/www/venqore/app-code/main-app
autostart=true
autorestart=true
user=www-data
# MariaDB 10.5 has no SKIP LOCKED. Keep exactly one database worker until the
# database is upgraded to a version where concurrent workers are safe.
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/venqore-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
