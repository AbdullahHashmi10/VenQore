; VenQore POS — queue worker supervisor config
;
; This process keeps `php artisan queue:work` running continuously so
; queued jobs (DeployDemoStoreJob, QueueHeartbeatJob, and any other
; ShouldQueue job in the app) actually get processed. Without a worker
; running somewhere, jobs just pile up in the `jobs` table forever and
; DemoStoreController's demo deploy/reset falls back to running inline
; every time (see queueWorkerLooksAlive() in
; app/Http/Controllers/Admin/DemoStoreController.php).
;
; INSTALL (Ubuntu/Debian with supervisor installed):
;   sudo cp deploy/venqore-queue-worker.supervisor.conf /etc/supervisor/conf.d/venqore-queue-worker.conf
;   # Edit the paths below (directory, command, user) to match your server first.
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start venqore-queue-worker:*
;
; VERIFY:
;   sudo supervisorctl status venqore-queue-worker:*
;   tail -f storage/logs/queue-worker.log
;
; If you don't have supervisor available (some shared/managed hosts don't),
; the equivalent minimal alternative is a cron entry that runs queue:work
; with --stop-when-empty every minute — see the commented block at the
; bottom of this file. It's less resilient (a burst of jobs mid-run can
; overlap) but requires no extra software.

[program:venqore-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/venqore/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=600
directory=/path/to/venqore
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/venqore/storage/logs/queue-worker.log
stopwaitsecs=3600

; ── Cron-only fallback (no supervisor) ──────────────────────────────────
; Add this to `crontab -e` for the web server user INSTEAD of the
; supervisor config above if supervisor isn't available on this host.
; Runs a worker that drains whatever's queued then exits, every minute —
; overlapping runs are avoided by --stop-when-empty finishing quickly when
; the queue is already empty.
;
; * * * * * cd /path/to/venqore && php artisan queue:work --stop-when-empty --tries=3 --timeout=600 >> storage/logs/queue-worker.log 2>&1
;
; You ALSO need the standard Laravel scheduler cron entry for
; QueueHeartbeatJob, demo:restore (nightly), and demo:full-deploy +
; demo:snapshot (weekly) to ever fire at all:
;
; * * * * * cd /path/to/venqore && php artisan schedule:run >> /dev/null 2>&1
