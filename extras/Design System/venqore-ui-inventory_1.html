<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VenQore POS — Complete UI Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
        numeric: ['Space Grotesk', 'sans-serif'],
        mono: ['JetBrains Mono', 'monospace'],
      },
      borderRadius: {
        none: '0px', xs: '2px', sm: '6px', md: '10px', DEFAULT: '12px',
        lg: '12px', xl: '16px', '2xl': '20px', '3xl': '24px', full: '9999px',
      },
      colors: {
        surface: 'rgb(var(--vq-bg-surface) / <alpha-value>)',
        app: 'rgb(var(--vq-bg-app) / <alpha-value>)',
        raised: 'rgb(var(--vq-bg-raised) / <alpha-value>)',
        sunken: 'rgb(var(--vq-bg-sunken) / <alpha-value>)',
      }
    }
  }
}


// Senior Mode Toggle
const vqSeniorBtn = document.getElementById('vqsenior');
function setVqSeniorMode(enable) {
  document.documentElement.classList.toggle('senior-mode', enable);
  document.body.classList.toggle('senior-mode', enable);
  if (vqSeniorBtn) {
    vqSeniorBtn.textContent = enable ? '👓 Senior (+30%): ON' : '👓 Senior (+30%): OFF';
    vqSeniorBtn.classList.toggle('active', enable);
  }
  try { localStorage.setItem('vq-inventory-senior', enable ? 'true' : 'false'); } catch(e) {}
}
if (vqSeniorBtn) {
  vqSeniorBtn.addEventListener('click', () => {
    const isSenior = document.documentElement.classList.contains('senior-mode');
    setVqSeniorMode(!isSenior);
  });
}
try {
  if (localStorage.getItem('vq-inventory-senior') === 'true') {
    setVqSeniorMode(true);
  }
} catch(e) {}

</script>
