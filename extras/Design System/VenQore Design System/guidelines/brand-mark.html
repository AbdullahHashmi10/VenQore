<!-- @dsCard group="Brand" viewport="700x170" name="Logo mark + lockup" subtitle="The isometric Q-cube. No wordmark file was supplied — the name is set in Bricolage 600." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--vq-bg);color:var(--vq-text);font-family:var(--vq-font-sans);padding:18px;height:170px;box-sizing:border-box;overflow:hidden}.g{display:flex;gap:10px}.sw{flex:1;border-radius:var(--vq-r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:74px;border:1px solid var(--vq-line-soft)}.hx{font:500 10px/1.3 var(--vq-font-numeric);letter-spacing:.02em}.nm{font:600 11px/1.3 var(--vq-font-sans)}.lbl{font-family:var(--vq-font-numeric);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--vq-text-3)}</style></head><body>
<div style="display:flex;gap:28px;align-items:center;height:100%">
  <img src="../assets/logo-mark.png" alt="VenQore mark" style="width:76px;height:76px"/>
  <div style="display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--vq-surface);border:1px solid var(--vq-line);border-radius:20px;box-shadow:var(--vq-elev-1)">
    <img src="../assets/logo-mark.png" alt="" style="width:30px;height:30px"/>
    <span style="font:600 24px/1 var(--vq-font-display);letter-spacing:-.03em">VenQore</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;padding:14px 20px;background:#0C1211;border-radius:20px">
    <img src="../assets/logo-mark.png" alt="" style="width:30px;height:30px"/>
    <span style="font:600 24px/1 var(--vq-font-display);letter-spacing:-.03em;color:#EDF2EF">VenQore</span>
  </div>
</div></body></html>
