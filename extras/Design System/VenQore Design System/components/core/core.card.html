<!doctype html><html><head><meta charset="utf-8">
<title>Core components</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--vq-bg);font-family:var(--vq-font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:flex;flex-direction:column;gap:14px}.lbl{font-family:var(--vq-font-numeric);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--vq-text-3)}</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
const { Button, IconButton, Badge, Chip, Avatar, AvatarStack } = window.VenQoreDesignSystem_76c34c;
const Arrow = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M5 12h13m-5-6 6 6-6 6"/></svg>;
const Plus = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;
const Bell = () => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>;
function Demo(){
  const [tab, setTab] = React.useState("All");
  return (
    <div className="stack">
      <div className="row">
        <Button icon={<Plus/>}>Add project</Button>
        <Button variant="secondary" iconAfter={<Arrow/>}>Import data</Button>
        <Button variant="soft">Month</Button>
        <Button variant="ghost">Cancel</Button>
        <Button variant="danger" size="sm">Delete INV-2291</Button>
        <Button disabled>Disabled</Button>
      </div>
      <div className="row">
        <Badge tone="success">Reconciled</Badge>
        <Badge tone="warning">Low stock</Badge>
        <Badge tone="danger">Overdue</Badge>
        <Badge tone="accent">Blueprint</Badge>
        <Badge tone="info">Syncing</Badge>
        <Badge tone="neutral" dot={false}>Draft</Badge>
        <IconButton label="Notifications"><Bell/></IconButton>
        <IconButton label="Filter" active><Plus/></IconButton>
      </div>
      <div className="row">
        {["All","Overdue","Paid","Draft"].map((t,i)=>(
          <Chip key={t} selected={tab===t} count={[128,12,96,20][i]} onClick={()=>setTab(t)}>{t}</Chip>
        ))}
        <span style={{width:12}}/>
        <Avatar name="Ahmad Raza" ring/>
        <AvatarStack people={["Alexandra Deff","Edwin Adenike","Isaac Oluwa","David Oshodi","Zoya K","Bilal M"]}/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
