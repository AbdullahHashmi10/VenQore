<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces — light and dark, side by side" subtitle="Soft page, white floaters. Dark is selected, not inverted." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--vq-bg);color:var(--vq-text);font-family:var(--vq-font-sans);padding:18px;height:190px;box-sizing:border-box;overflow:hidden}.g{display:flex;gap:10px}.sw{flex:1;border-radius:var(--vq-r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:74px;border:1px solid var(--vq-line-soft)}.hx{font:500 10px/1.3 var(--vq-font-numeric);letter-spacing:.02em}.nm{font:600 11px/1.3 var(--vq-font-sans)}.lbl{font-family:var(--vq-font-numeric);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--vq-text-3)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%">
  <div style="background:#F1F5F2;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid #D3DCD7">
    <div class="lbl">light · page #F1F5F2</div>
    <div style="background:#fff;border:1px solid #D3DCD7;border-radius:14px;padding:10px;box-shadow:0 10px 24px -10px rgb(13 20 18/.12)"><div class="nm" style="color:#17201B">Card #FFFFFF</div><div class="hx" style="color:#536159">text-2 #536159</div></div>
    <div style="background:#E6ECE8;border-radius:12px;padding:8px"><div class="hx" style="color:#536159">sunken #E6ECE8</div></div>
  </div>
  <div style="background:#0C1211;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid rgb(255 255 255/.1)">
    <div class="lbl" style="color:#8B9A93">dark · page #0C1211</div>
    <div style="background:#141B19;border:1px solid rgb(255 255 255/.1);border-radius:14px;padding:10px"><div class="nm" style="color:#EDF2EF">Card #141B19</div><div class="hx" style="color:#A8B4AE">text-2 #A8B4AE</div></div>
    <div style="background:#080D0C;border-radius:12px;padding:8px"><div class="hx" style="color:#8B9A93">sunken #080D0C</div></div>
  </div>
</div></body></html>
