<!-- @dsCard group="Colors" viewport="700x160" name="Semantic — state, not decoration" subtitle="Light value, dark value, tint background. Colour never carries meaning alone." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--vq-bg);color:var(--vq-text);font-family:var(--vq-font-sans);padding:18px;height:160px;box-sizing:border-box;overflow:hidden}.g{display:flex;gap:10px}.sw{flex:1;border-radius:var(--vq-r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:74px;border:1px solid var(--vq-line-soft)}.hx{font:500 10px/1.3 var(--vq-font-numeric);letter-spacing:.02em}.nm{font:600 11px/1.3 var(--vq-font-sans)}.lbl{font-family:var(--vq-font-numeric);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--vq-text-3)}</style></head><body>
<div class="g" style="flex-direction:column;gap:8px">

<div style="display:grid;grid-template-columns:92px 62px 62px 62px 1fr;gap:8px;align-items:center">
  <div class="nm">Success</div>
  <div style="height:26px;border-radius:8px;background:#12855C"></div>
  <div style="height:26px;border-radius:8px;background:#4BD99B"></div>
  <div style="height:26px;border-radius:8px;background:#E4F6EC;border:1px solid var(--vq-line)"></div>
  <div class="hx" style="color:var(--vq-text-3)">posted · reconciled · in stock</div>
</div>
<div style="display:grid;grid-template-columns:92px 62px 62px 62px 1fr;gap:8px;align-items:center">
  <div class="nm">Warning</div>
  <div style="height:26px;border-radius:8px;background:#A6690A"></div>
  <div style="height:26px;border-radius:8px;background:#F7C05A"></div>
  <div style="height:26px;border-radius:8px;background:#FFF3D6;border:1px solid var(--vq-line)"></div>
  <div class="hx" style="color:var(--vq-text-3)">low stock · needs approval</div>
</div>
<div style="display:grid;grid-template-columns:92px 62px 62px 62px 1fr;gap:8px;align-items:center">
  <div class="nm">Danger</div>
  <div style="height:26px;border-radius:8px;background:#C4443A"></div>
  <div style="height:26px;border-radius:8px;background:#FF8A7E"></div>
  <div style="height:26px;border-radius:8px;background:#FDEAE7;border:1px solid var(--vq-line)"></div>
  <div class="hx" style="color:var(--vq-text-3)">out of balance · overdue</div>
</div>
<div style="display:grid;grid-template-columns:92px 62px 62px 62px 1fr;gap:8px;align-items:center">
  <div class="nm">Info</div>
  <div style="height:26px;border-radius:8px;background:#1B7096"></div>
  <div style="height:26px;border-radius:8px;background:#7BD4E6"></div>
  <div style="height:26px;border-radius:8px;background:#DDF2FB;border:1px solid var(--vq-line)"></div>
  <div class="hx" style="color:var(--vq-text-3)">neutral system notice</div>
</div>
</div></body></html>
