<!-- @dsCard group="Motion" viewport="700x170" name="Motion — spring in, settle, stop" subtitle="120 / 200 / 320 / 520ms · ease-out for colour, spring for entrances" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--vq-bg);color:var(--vq-text);font-family:var(--vq-font-sans);padding:18px;height:170px;box-sizing:border-box;overflow:hidden}.g{display:flex;gap:10px}.sw{flex:1;border-radius:var(--vq-r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:74px;border:1px solid var(--vq-line-soft)}.hx{font:500 10px/1.3 var(--vq-font-numeric);letter-spacing:.02em}.nm{font:600 11px/1.3 var(--vq-font-sans)}.lbl{font-family:var(--vq-font-numeric);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--vq-text-3)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:12px">

<div style="display:grid;grid-template-columns:130px 1fr 190px;gap:12px;align-items:center">
 <div class="nm">dur-1 · 120ms</div>
 <div style="height:8px;border-radius:999px;background:var(--vq-chart-track);position:relative;overflow:hidden"><div style="position:absolute;inset:0;width:30%;border-radius:999px;background:var(--vq-accent);animation:sl 1.2s cubic-bezier(.34,1.56,.64,1) infinite alternate"></div></div>
 <div class="hx" style="color:var(--vq-text-3)">hover colour, focus ring</div></div>
<div style="display:grid;grid-template-columns:130px 1fr 190px;gap:12px;align-items:center">
 <div class="nm">dur-2 · 200ms</div>
 <div style="height:8px;border-radius:999px;background:var(--vq-chart-track);position:relative;overflow:hidden"><div style="position:absolute;inset:0;width:30%;border-radius:999px;background:var(--vq-accent);animation:sl 1.6s cubic-bezier(.34,1.56,.64,1) infinite alternate"></div></div>
 <div class="hx" style="color:var(--vq-text-3)">buttons, chips, switches</div></div>
<div style="display:grid;grid-template-columns:130px 1fr 190px;gap:12px;align-items:center">
 <div class="nm">dur-3 · 320ms</div>
 <div style="height:8px;border-radius:999px;background:var(--vq-chart-track);position:relative;overflow:hidden"><div style="position:absolute;inset:0;width:30%;border-radius:999px;background:var(--vq-accent);animation:sl 2s cubic-bezier(.34,1.56,.64,1) infinite alternate"></div></div>
 <div class="hx" style="color:var(--vq-text-3)">dropdowns, tabs, card lift</div></div>
<div style="display:grid;grid-template-columns:130px 1fr 190px;gap:12px;align-items:center">
 <div class="nm">dur-4 · 520ms</div>
 <div style="height:8px;border-radius:999px;background:var(--vq-chart-track);position:relative;overflow:hidden"><div style="position:absolute;inset:0;width:30%;border-radius:999px;background:var(--vq-accent);animation:sl 2.4000000000000004s cubic-bezier(.34,1.56,.64,1) infinite alternate"></div></div>
 <div class="hx" style="color:var(--vq-text-3)">modals, drawers, reveals</div></div>
</div><style>@keyframes sl{from{transform:translateX(0)}to{transform:translateX(233%)}}</style></body></html>
