<!-- @dsCard group="Type" viewport="700x180" name="Numeric voice — Space Grotesk, tabular" subtitle="Every figure that means money, stock or a count. tnum always on." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--vq-bg);color:var(--vq-text);font-family:var(--vq-font-sans);padding:18px;height:180px;box-sizing:border-box;overflow:hidden}.g{display:flex;gap:10px}.sw{flex:1;border-radius:var(--vq-r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:74px;border:1px solid var(--vq-line-soft)}.hx{font:500 10px/1.3 var(--vq-font-numeric);letter-spacing:.02em}.nm{font:600 11px/1.3 var(--vq-font-sans)}.lbl{font-family:var(--vq-font-numeric);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--vq-text-3)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
  <div class="vq-num" style="font:600 38px/1 var(--vq-font-numeric);letter-spacing:-.03em">Rs 6,636,549.20</div>
  <div style="display:flex;gap:24px;align-items:baseline">
    <div class="vq-num" style="font:600 26px/1 var(--vq-font-numeric);letter-spacing:-.02em">−1,700.00</div>
    <div class="vq-num" style="font:500 16px/1 var(--vq-font-numeric);color:var(--vq-text-2)">0123456789</div>
    <div class="lbl">eyebrow · 11px · +12% tracking</div>
  </div>
  <div class="hx" style="color:var(--vq-text-3)">Negative figures also get a sign and parentheses — never colour alone.</div>
</div></body></html>
