<!-- @dsCard group="Shape" viewport="700x170" name="Elevation — two-part shadows + one coloured glow" subtitle="Neutral shadows everywhere; mint glow only on primary actions." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--vq-bg);color:var(--vq-text);font-family:var(--vq-font-sans);padding:18px;height:170px;box-sizing:border-box;overflow:hidden}.g{display:flex;gap:10px}.sw{flex:1;border-radius:var(--vq-r-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:74px;border:1px solid var(--vq-line-soft)}.hx{font:500 10px/1.3 var(--vq-font-numeric);letter-spacing:.02em}.nm{font:600 11px/1.3 var(--vq-font-sans)}.lbl{font-family:var(--vq-font-numeric);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--vq-text-3)}</style></head><body>
<div style="display:flex;gap:14px">
<div style="flex:1;text-align:center"><div style="height:80px;background:var(--vq-surface);border:1px solid var(--vq-line);border-radius:20px;box-shadow:var(--vq-elev-1)"></div><div class="nm" style="margin-top:8px">elev-1</div></div><div style="flex:1;text-align:center"><div style="height:80px;background:var(--vq-surface);border:1px solid var(--vq-line);border-radius:20px;box-shadow:var(--vq-elev-2)"></div><div class="nm" style="margin-top:8px">elev-2</div></div><div style="flex:1;text-align:center"><div style="height:80px;background:var(--vq-surface);border:1px solid var(--vq-line);border-radius:20px;box-shadow:var(--vq-elev-3)"></div><div class="nm" style="margin-top:8px">elev-3</div></div>
<div style="flex:1;text-align:center"><div style="height:80px;background:var(--vq-grad-mint);border-radius:20px;box-shadow:var(--vq-glow-accent)"></div><div class="nm" style="margin-top:8px">glow-accent</div></div>
</div></body></html>
