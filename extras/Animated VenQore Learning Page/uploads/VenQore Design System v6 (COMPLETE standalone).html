<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VenQore Design System v5 — Qore (complete standalone)</title>

<style>
/* ── VenQore v5 raw ramps ──────────────────────────────────────────────────
   v2 capped brand chroma at 0.071 and the product read grey. v5 runs the
   brand hot (chroma ~0.13 at the 400 step) and keeps the neutrals faintly
   green so saturated teal never looks pasted on. */
:root {
  /* Qore Teal — the brand. Mint at the top, deep pine at the bottom. */
  --vq-teal-50: #E6FBF5;
  --vq-teal-100: #C6F5E9;
  --vq-teal-200: #93EBD6;
  --vq-teal-300: #59DBC0;
  --vq-teal-400: #23C4A6;
  --vq-teal-500: #0BAA8F;
  --vq-teal-600: #088975;
  --vq-teal-700: #076B5E;
  --vq-teal-800: #0A5049;
  --vq-teal-900: #0B3A35;
  --vq-teal-950: #062421;

  /* Ink — neutrals with a 160° cast so they sit *with* the teal. */
  --vq-ink-0: #FFFFFF;
  --vq-ink-25: #F8FAF8;
  --vq-ink-50: #F1F5F2;
  --vq-ink-100: #E6ECE8;
  --vq-ink-200: #D3DCD7;
  --vq-ink-300: #B4C0BA;
  --vq-ink-400: #8B9A93;
  --vq-ink-500: #6B7A73;
  --vq-ink-600: #536159;
  --vq-ink-700: #3C4841;
  --vq-ink-800: #29332D;
  --vq-ink-900: #17201B;
  --vq-ink-950: #0D1412;
  --vq-ink-1000: #060A09;

  /* Playmates — three warm counterpoints + one cool. Used for delight and
     for categorical data. Never for "good/bad" meaning (that's semantic). */
  --vq-lime-100: #EEF9D7;
  --vq-lime-300: #C8EE7E;
  --vq-lime-400: #A9E34B;
  --vq-lime-500: #8CCB2E;
  --vq-lime-700: #5E8C15;

  --vq-coral-100: #FFE8E1;
  --vq-coral-300: #FFAE96;
  --vq-coral-400: #FF8A6B;
  --vq-coral-500: #F26A47;
  --vq-coral-700: #B94526;

  --vq-butter-100: #FFF3D6;
  --vq-butter-300: #FFDD8E;
  --vq-butter-400: #FFCD5B;
  --vq-butter-500: #F5B32E;
  --vq-butter-700: #A6740A;

  --vq-sky-100: #DDF2FB;
  --vq-sky-300: #8FD9F5;
  --vq-sky-400: #55C4EC;
  --vq-sky-500: #2BA5D1;
  --vq-sky-700: #1B7096;

  --vq-plum-300: #E0B4E0;
  --vq-plum-400: #C98BC9;
  --vq-plum-500: #B266A8;
  --vq-plum-700: #7E3E76;

  /* Categorical data slots — fixed order, never cycled. Slot 1 is the brand. */
  --vq-series-1: #0BAA8F;
  --vq-series-2: #F26A47;
  --vq-series-3: #2BA5D1;
  --vq-series-4: #F5B32E;
  --vq-series-5: #8CCB2E;
  --vq-series-6: #B266A8;
  --vq-series-7: #0B3A35;
  --vq-series-8: #8B9A93;

  /* Sequential (magnitude) and diverging (polarity) ramps. */
  --vq-seq-1: #C6F5E9; --vq-seq-2: #59DBC0; --vq-seq-3: #0BAA8F;
  --vq-seq-4: #076B5E; --vq-seq-5: #0B3A35;
  --vq-div-neg-2: #C4443A; --vq-div-neg-1: #F0A79E;
  --vq-div-mid: #E6ECE8;
  --vq-div-pos-1: #6FDCC3; --vq-div-pos-2: #088975;
}
:root {
  --vq-font-display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --vq-font-sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --vq-font-numeric: "Space Grotesk", ui-monospace, "SF Mono", monospace;
  --vq-font-mono: "Space Grotesk", ui-monospace, "SF Mono", monospace;

  /* Display voice — Bricolage, weight 600, tracking pulled tight. */
  --vq-fs-hero: 76px;
  --vq-lh-hero: 0.98; /* @kind other */
  --vq-ls-hero: -0.038em; /* @kind other */
  --vq-fs-display: 56px;
  --vq-lh-display: 1.02; /* @kind other */
  --vq-ls-display: -0.032em; /* @kind other */
  --vq-fs-h1: 40px;
  --vq-lh-h1: 1.08; /* @kind other */
  --vq-ls-h1: -0.028em; /* @kind other */
  --vq-fs-h2: 30px;
  --vq-lh-h2: 1.16; /* @kind other */
  --vq-ls-h2: -0.024em; /* @kind other */
  --vq-fs-h3: 21px;
  --vq-lh-h3: 1.30; /* @kind other */
  --vq-ls-h3: -0.016em; /* @kind other */

  /* Text voice — Plus Jakarta Sans. */
  --vq-fs-lede: 19px;
  --vq-lh-lede: 1.55; /* @kind other */
  --vq-ls-lede: -0.008em; /* @kind other */
  --vq-fs-body: 16px;
  --vq-lh-body: 1.6; /* @kind other */
  --vq-ls-body: -0.002em; /* @kind other */
  --vq-fs-small: 14px;
  --vq-lh-small: 1.5; /* @kind other */
  --vq-ls-small: 0em; /* @kind other */
  --vq-fs-caption: 13px;
  --vq-lh-caption: 1.45; /* @kind other */
  --vq-ls-caption: 0em; /* @kind other */

  /* Numeric voice — Space Grotesk, tabular. */
  --vq-fs-metric: 38px;
  --vq-lh-metric: 1.0; /* @kind other */
  --vq-ls-metric: -0.03em; /* @kind other */
  --vq-fs-metric-sm: 26px;
  --vq-fs-eyebrow: 11px;
  --vq-lh-eyebrow: 1.2; /* @kind other */
  --vq-ls-eyebrow: 0.12em; /* @kind other */

  --vq-fw-regular: 400; /* @kind other */
  --vq-fw-medium: 500; /* @kind other */
  --vq-fw-semi: 600; /* @kind other */
  --vq-fw-bold: 700; /* @kind other */
  --vq-measure: 68ch; /* @kind other */
}
:root {
  --vq-space-0: 0px;   --vq-space-1: 4px;   --vq-space-2: 8px;
  --vq-space-3: 12px;  --vq-space-4: 16px;  --vq-space-5: 20px;
  --vq-space-6: 24px;  --vq-space-7: 28px;  --vq-space-8: 32px;
  --vq-space-10: 40px; --vq-space-12: 48px; --vq-space-14: 56px;
  --vq-space-16: 64px; --vq-space-20: 80px; --vq-space-24: 96px;
  --vq-space-32: 128px;

  /* Density — v5 runs roomier than v2. Playful needs air. */
  --vq-control-sm: 34px;
  --vq-control-md: 42px;
  --vq-control-lg: 48px;
  --vq-control-xl: 56px;
  --vq-row-h: 52px;
  --vq-row-head-h: 40px;
  --vq-rail-w: 248px;
  --vq-rail-w-min: 76px;
  --vq-topbar-h: 68px;
  --vq-page-max: 1240px;
  --vq-gutter: 20px;      /* gap between dashboard cards */
  --vq-section-y: 112px;  /* marketing section rhythm */

  /* Stacking ladder — these twelve are the only legal z-index values. */
  --vq-z-base: 0; /* @kind other */
  --vq-z-raised: 10; /* @kind other */
  --vq-z-sticky: 100; /* @kind other */
  --vq-z-nav: 200; /* @kind other */
  --vq-z-rail: 300; /* @kind other */
  --vq-z-dropdown: 400; /* @kind other */
  --vq-z-drawer: 500; /* @kind other */
  --vq-z-modal: 600; /* @kind other */
  --vq-z-popover: 700; /* @kind other */
  --vq-z-tooltip: 800; /* @kind other */
  --vq-z-toast: 900; /* @kind other */
  --vq-z-command: 1000; /* @kind other */
}
/* v5 shape: soft and chunky. v2's 10px base read like a bank form; the
   playful register lives between 14 and 28. Nesting rule stays:
   inner radius = outer radius − inner padding. */
:root {
  --vq-r-none: 0px;
  --vq-r-xs: 8px;    /* checkbox, cell chip */
  --vq-r-sm: 12px;   /* badge, tag, tooltip, small inner tile */
  --vq-r-md: 14px;   /* BASE — input, select, menu item */
  --vq-r-lg: 20px;   /* card, panel, dropdown surface, button */
  --vq-r-xl: 28px;   /* modal, drawer, big feature tile, KPI card */
  --vq-r-2xl: 36px;  /* CEILING — hero card, app frame */
  --vq-r-full: 999px;
}
/* Two-part shadows: a tight contact shadow plus a wide soft bloom. Neutral,
   never teal-tinted — except --vq-glow-accent, which is the one deliberate
   coloured light in the system (primary buttons and the active KPI card). */
:root {
  --vq-elev-0: none;
  --vq-elev-1: 0 1px 2px rgb(13 20 18 / .05), 0 2px 8px -4px rgb(13 20 18 / .06);
  --vq-elev-2: 0 1px 2px rgb(13 20 18 / .05), 0 10px 24px -10px rgb(13 20 18 / .12);
  --vq-elev-3: 0 2px 4px rgb(13 20 18 / .06), 0 24px 56px -16px rgb(13 20 18 / .20);
  --vq-elev-inset: inset 0 1px 0 rgb(255 255 255 / .55);
  --vq-glow-accent: 0 6px 20px -6px rgb(11 170 143 / .55);
  --vq-glow-accent-strong: 0 10px 32px -8px rgb(11 170 143 / .70);
  --vq-ring-focus: 0 0 0 4px rgb(35 196 166 / .30);
}
/* v5 motion has a pulse. Things arrive with a little overshoot, settle, and
   never wobble twice. Springs are for entrances, toggles, chips and counters;
   colour/hover changes stay on --vq-ease-out so they feel instant. */
:root {
  --vq-dur-1: 120ms; /* @kind other */
  --vq-dur-2: 200ms; /* @kind other */
  --vq-dur-3: 320ms; /* @kind other */
  --vq-dur-4: 520ms; /* @kind other */
  --vq-dur-amb: 9000ms; /* @kind other */
  --vq-ease-out: cubic-bezier(.22, 1, .36, 1); /* @kind other */
  --vq-ease-in-out: cubic-bezier(.65, 0, .35, 1); /* @kind other */
  --vq-ease-spring: cubic-bezier(.34, 1.56, .64, 1); /* @kind other */
  --vq-ease-spring-soft: cubic-bezier(.32, 1.28, .5, 1); /* @kind other */
  --vq-stagger: 60ms; /* @kind other */
}
/* ── Semantic layer — LIGHT (default) ─────────────────────────────────────
   The light theme is not white-on-white. The page is a soft green-grey and
   cards are pure white, so every card floats. That contrast is where the
   "lively" comes from — v2 put grey cards on a white page and everything
   sank. */
:root {
  --vq-bg: #F1F5F2;              /* page — never pure white */
  --vq-bg-alt: #E9EFEB;          /* alternating marketing band */
  --vq-surface: #FFFFFF;         /* cards, panels — the floaters */
  --vq-surface-2: var(--vq-ink-25);
  --vq-sunken: var(--vq-ink-100);
  --vq-raised: #FFFFFF;          /* menus, popovers, modals */
  --vq-scrim: rgb(13 20 18 / .40);
  --vq-glass: rgb(255 255 255 / .72);
  --vq-glass-blur: 18px; /* @kind other */

  --vq-text: var(--vq-ink-900);
  --vq-text-2: var(--vq-ink-600);
  --vq-text-3: var(--vq-ink-500);   /* lightest legal text */
  --vq-text-inverted: #FFFFFF;

  --vq-accent: var(--vq-teal-500);        /* the identity colour */
  --vq-accent-fill: var(--vq-teal-600);   /* solid buttons — white on it */
  --vq-accent-fill-hover: var(--vq-teal-700);
  --vq-accent-text: var(--vq-teal-700);   /* links, inline accent */
  --vq-accent-quiet: var(--vq-teal-50);   /* tint wash — takes ink text */
  --vq-accent-quiet-line: var(--vq-teal-200);
  --vq-on-accent: #FFFFFF;
  --vq-on-danger: #FFFFFF;

  --vq-line: var(--vq-ink-200);
  --vq-line-soft: var(--vq-ink-100);
  --vq-line-strong: var(--vq-ink-300);
  --vq-focus: var(--vq-teal-400);

  --vq-success: #12855C; --vq-success-bg: #E4F6EC; --vq-success-line: #A9E0C4;
  --vq-warning: #A6690A; --vq-warning-bg: #FFF3D6; --vq-warning-line: #F2D08A;
  --vq-danger:  #C4443A; --vq-danger-bg:  #FDEAE7; --vq-danger-line:  #F3B7AF;
  --vq-info:    #1B7096; --vq-info-bg:    #DDF2FB; --vq-info-line:    #A8DCF0;

  --vq-chart-surface: #FFFFFF;
  --vq-chart-grid: var(--vq-ink-100);
  --vq-chart-axis: var(--vq-ink-300);
  --vq-chart-label: var(--vq-ink-500);
  --vq-chart-track: var(--vq-ink-100);   /* the unfilled part of a bar/ring */

  /* The signature marketing gradient: deep pine → mint → page. */
  --vq-grad-hero: linear-gradient(175deg, #062421 0%, #0A5049 34%, #23C4A6 72%, #E6FBF5 100%); /* @kind color */
  --vq-grad-mint: linear-gradient(135deg, #23C4A6 0%, #0BAA8F 55%, #076B5E 100%); /* @kind color */
  --vq-grad-mesh: radial-gradient(50% 60% at 18% 12%, rgba(35, 196, 166, 0.55), transparent 68%), radial-gradient(46% 52% at 82% 78%, rgba(7, 107, 94, 0.62), transparent 66%), radial-gradient(38% 40% at 60% 25%, rgba(93, 165, 176, 0.22), transparent 70%), #0A0B0F;
  --vq-grad-spot: radial-gradient(60% 70% at 20% 10%, rgb(35 196 166 / .40), transparent 70%),
                  radial-gradient(50% 60% at 85% 80%, rgb(11 58 53 / .35), transparent 70%); /* @kind color */
  --vq-grad-warm: linear-gradient(135deg, #FFCD5B 0%, #FF8A6B 100%); /* @kind color */
}

/* ── Semantic layer — DARK ────────────────────────────────────────────────
   Selected, not inverted. The v4 dark mode failed because everything was
   green: green surfaces, green text, green chrome. Here the surfaces are
   near-neutral charcoal with only a whisper of green, the TEXT is off-white,
   and mint appears only on the things you can act on. */
:root[data-theme="dark"], .vq-dark {
  --vq-bg: #0C1211;
  --vq-bg-alt: #0A0F0E;
  --vq-surface: #141B19;
  --vq-surface-2: #1A2220;
  --vq-sunken: #080D0C;
  --vq-raised: #1D2624;
  --vq-scrim: rgb(3 6 5 / .66);
  --vq-glass: rgb(20 27 25 / .72);

  --vq-text: #EDF2EF;
  --vq-text-2: #A8B4AE;
  --vq-text-3: #8B9A93;
  --vq-text-inverted: #0C1211;

  --vq-accent: var(--vq-teal-400);
  --vq-accent-fill: var(--vq-teal-500);
  --vq-accent-fill-hover: var(--vq-teal-400);
  --vq-accent-text: var(--vq-teal-300);
  --vq-accent-quiet: rgb(35 196 166 / .14);
  --vq-accent-quiet-line: rgb(35 196 166 / .28);
  --vq-on-accent: #062421;
  --vq-on-danger: #2A0705;

  --vq-line: rgb(255 255 255 / .10);
  --vq-line-soft: rgb(255 255 255 / .06);
  --vq-line-strong: rgb(255 255 255 / .20);
  --vq-focus: var(--vq-teal-300);

  --vq-success: #4BD99B; --vq-success-bg: rgb(75 217 155 / .13); --vq-success-line: rgb(75 217 155 / .28);
  --vq-warning: #F7C05A; --vq-warning-bg: rgb(247 192 90 / .13); --vq-warning-line: rgb(247 192 90 / .28);
  --vq-danger:  #FF8A7E; --vq-danger-bg:  rgb(255 138 126 / .13); --vq-danger-line:  rgb(255 138 126 / .28);
  --vq-info:    #7BD4E6; --vq-info-bg:    rgb(123 212 230 / .12); --vq-info-line:    rgb(123 212 230 / .26);

  --vq-elev-1: 0 1px 0 rgb(255 255 255 / .04);
  --vq-elev-2: 0 1px 0 rgb(255 255 255 / .05), 0 12px 28px -14px rgb(0 0 0 / .7);
  --vq-elev-3: 0 1px 0 rgb(255 255 255 / .07), 0 28px 64px -20px rgb(0 0 0 / .8);
  --vq-elev-inset: inset 0 1px 0 rgb(255 255 255 / .06);
  --vq-glow-accent: 0 8px 26px -8px rgb(35 196 166 / .45);
  --vq-glow-accent-strong: 0 12px 38px -10px rgb(35 196 166 / .60);
  --vq-ring-focus: 0 0 0 4px rgb(89 219 192 / .26);

  --vq-chart-surface: #141B19;
  --vq-chart-grid: rgb(255 255 255 / .07);
  --vq-chart-axis: rgb(255 255 255 / .18);
  --vq-chart-label: #8B9A93;
  --vq-chart-track: rgb(255 255 255 / .09);

  --vq-series-1: #2CD3B3; --vq-series-2: #FF8A6B; --vq-series-3: #55C4EC;
  --vq-series-4: #FFCD5B; --vq-series-5: #A9E34B; --vq-series-6: #C98BC9;
  --vq-series-7: #C6F5E9; --vq-series-8: #8B9A93;

  --vq-seq-1: #0B3A35; --vq-seq-2: #076B5E; --vq-seq-3: #0BAA8F;
  --vq-seq-4: #59DBC0; --vq-seq-5: #C6F5E9;
  --vq-div-mid: #2A332F;

  --vq-grad-hero: linear-gradient(175deg, #041816 0%, #073B36 40%, #0BAA8F 88%, #23C4A6 100%); /* @kind color */
  --vq-grad-spot: radial-gradient(60% 70% at 20% 10%, rgb(35 196 166 / .22), transparent 70%),
                  radial-gradient(50% 60% at 85% 80%, rgb(11 170 143 / .16), transparent 70%); /* @kind color */
}
/* The handful of globals the system depends on. Everything else is a token. */
html {
  font-feature-settings: "ss01", "cv11";
  -webkit-text-size-adjust: 100%;
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

body {
  margin: 0;
  background: var(--vq-bg);
  color: var(--vq-text);
  font-family: var(--vq-font-sans);
  font-size: var(--vq-fs-body);
  line-height: var(--vq-lh-body);
  letter-spacing: var(--vq-ls-body);
  -webkit-font-smoothing: antialiased;
}

/* Display voice is opt-in — Bricolage on headings, never on UI labels. */
.vq-display, h1, h2, h3 {
  font-family: var(--vq-font-display);
  font-weight: var(--vq-fw-semi);
  letter-spacing: var(--vq-ls-h1);
  margin: 0;
}

/* Every number that means money, stock, or a count. */
.vq-num, .vq-metric, td.vq-num {
  font-family: var(--vq-font-numeric);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

.vq-eyebrow {
  font-family: var(--vq-font-numeric);
  font-size: var(--vq-fs-eyebrow);
  line-height: var(--vq-lh-eyebrow);
  letter-spacing: var(--vq-ls-eyebrow);
  text-transform: uppercase;
  font-weight: var(--vq-fw-medium);
  color: var(--vq-text-3);
}

a { color: var(--vq-accent-text); text-decoration-color: var(--vq-accent-quiet-line); text-underline-offset: 3px; transition: color var(--vq-dur-1) var(--vq-ease-out); }
a:hover { color: var(--vq-accent-fill-hover); text-decoration-color: currentColor; }

:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--vq-focus);
  outline-offset: 2px;
  border-radius: var(--vq-r-sm);
}

p { max-width: var(--vq-measure); text-wrap: pretty; }

/* Theme swaps are instant. A colour transition bound to a theme custom property
   can be left painted at the OLD theme's resolved value, so the toggle adds
   .vq-theming to <html>, flips data-theme, and removes it on the next frame. */
html.vq-theming, html.vq-theming *, html.vq-theming *::before, html.vq-theming *::after {
  transition: none !important;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}


@keyframes vqDrift { from { transform: translate3d(-2%,-1%,0) scale(1.04) } to { transform: translate3d(3%,2%,0) scale(1.12) } }
@keyframes vqRise { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
@keyframes vqPop { from { opacity: 0; transform: scale(.7) } to { opacity: 1; transform: scale(1) } }
@keyframes vqTrackSlide { from { transform: translateX(0); } to { transform: translateX(233%); } }
@keyframes vqSpin { to { transform: rotate(360deg); } }
.vq-spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: vqSpin 0.75s linear infinite; vertical-align: -2px; margin-right: 6px; }

body { margin: 0; background: var(--vq-bg); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--vq-line-strong); border-radius: 999px; }
</style>
