rt stages, target definitions, linked nodes or hierarchy. Intersect with role/plan access and supported size. Revalidate on the server; client menus are not authorization.`,`Shared versioned registry`],[`Separate siblings, combine deliberately`,`Sales total and sales history can share one visible card, but are separate reads today. Declare their dependency keys explicitly, batch by scope/period, and check matching units and completeness. Never infer a trend reading by string concatenation.`,`Adapter work`],[`Compare equivalent periods`,`Align local trading timezone, grain, closed/open days and elapsed time. Today so far should compare to the same elapsed window, not a whole previous day. A zero prior value shows “No comparable baseline”, never infinity percent.`,`Backend comparison policy`],[`Amounts and axes`,`Use decimal or integer minor-unit amounts on the server. Preserve currency and precision. Do not mix currencies without a documented conversion basis. Bars start at zero; signed returns stay signed. Pie/ring proportions require non-negative values.`,`Data and scale contract`],[`Targets are real records`,`A gauge needs target amount, owner, period, scope and version. Zero/missing target disables progress. Permit more than 100% text while the track saturates at 100%. Channel rings require one target per channel; never use category share as attainment.`,`Target storage required`],[`Funnels need cohorts`,`Supply ordered stages, counts, cohort/window and deduplication rules. Current stage inventory is not cohort conversion. If counts grow between stages, explain the semantics or reject a conversion funnel. Labels and values live outside narrow segments.`,`Pipeline adapter required`],[`Flows and hierarchies need structure`,`Sankey requires stable node IDs, valid links, non-negative amounts and conservation checks for the selected meaning. Sunburst requires a tree with leaf rollups, unique identities and no double counting. Do not invent either from a flat category list.`,`New contracts; not chart aliases`],[`Radar and scatter need units`,`Radar needs meaningful normalized dimensions and a documented denominator per score. Scatter needs paired observations with real X and Y meaning; this library’s time-scatter uses dates on X. Add a numeric X implementation before offering price-versus-margin.`,`Capability gating`],[`Heatmap and live are different products`,`Heatmap needs explicit row/column buckets, timezone, missing-vs-zero semantics and an accessible color legend. Live needs ordered event IDs, resume cursor, deduplication, late-event policy, backpressure, disconnection state and a pause control. Polling a scalar is not live history.`,`Backend work required`],[`Records remain records`,`Recent transactions need permission-aware pagination, stable IDs, sorting, formatting and drill-through links. Do not chart arbitrary receipt order. Only offer a trend after a deliberate aggregation query.`,`Table/feed family`],[`12 columns belong to available space`,`Measure the board after nav and side-panel allocation, not window width. Persist preferred span/shape/order; resolve a larger span when pixel floors demand it. Full width always means span 12 of the remaining board. Do not overwrite preferences when the screen narrows.`,`Responsive contract demonstrated above`],[`Predictable reflow, not holes`,`Pack cards in stable reading order with explicit row tracks and gutters. Span compatibility alone cannot guarantee hole-free packing. Test a multi-card board with portrait cards, removals, pinned positions and permission changes before selecting the final packing algorithm.`,`Open: packing prototype still required`],[`Panels have a budget`,`This workshop uses a 720px remaining-board budget: below that, secondary panels overlay; navigation overlays below 900px. These are proposed thresholds, not replacements for the existing 1216px shell rule. Validate against real shell widths, then centralize them.`,`Proposed; integrate with OneGlanceLayout`],[`Adaptive interiors`,`Keep header, plot, legend and footer separate inside a fixed row-span frame. Measure content and promote to additional whole rows instead of scrolling inside the card. Reserve axis margins before measuring the plot. Reduce tick count at narrow widths; abbreviate amounts with exact tooltip/table values. Circular charts retain their aspect ratio. Portrait charts gain vertical room; full-width rings do not stretch into ellipses.`,`Implemented in workshop`],[`Loading without false data`,`Use BKLIT pulse/sweep/column/cell loaders only as clearly marked placeholders. Reuse last-known values only with a stale timestamp. Request IDs/abort prevent an old period response from replacing a newer one. Never display a success-looking dummy series during reconciliation.`,`Renderer + request lifecycle`],[`Persistence and migration`,`Version card specs. Preserve reading_key, period, args, style and current layouts. Add explicit renderer variant and preferred size semantics; audit the spec migration against model/API serialization first. Convert copies, retain rollback data, and surface unsupported legacy choices instead of silently changing their meaning.`,`No production migration performed`],[`Editor transactions and failures`,`Keep a draft until Save; Cancel restores the saved card. Validate title, data capability, variant and size on both sides. Use dashboard revision / ETag to avoid overwriting another device; show failed saves and permit retry. Local storage is only this demo’s persistence.`,`API acceptance criteria`],[`Performance and accessibility`,`Use stable React keys and one measured layout pass; avoid rebuilding the board on hover. Batch reads, cache by tenant/filter/period, pause hidden/live charts and cap point counts. Preserve extrema when decimating. Provide keyboard legends, tabular values, non-color cues and reduced motion.`,`Acceptance criteria`],[`Do not delete older dashboards yet`,`Inventory active routes and tenant usage. Move the main dashboard behind a feature flag to the shared renderer and existing backend pipeline. Migrate saved layouts separately; retire Workspace and legacy pages only after parity and rollback checks.`,`Rollout decision`]];function cP(){return(0,J.jsxs)(`section`,{className:`production-notes`,id:`production`,children:[(0,J.jsxs)(`div`,{className:`notes-heading`,children:[(0,J.jsx)(`span`,{className:`pill`,children:`Implementation notebook`}),(0,J.jsx)(`h2`,{children:`What this changes in the real dashboard`}),(0,J.jsx)(`p`,{children:`The workshop tests presentation and sizing. These notes preserve the data, architecture and migration decisions it exposes. “Mock available” never means “production ready”.`})]}),(0,J.jsxs)(`div`,{className:`evidence`,children:[(0,J.jsx)(`h3`,{children:`Verified in the current source`}),(0,J.jsxs)(`ul`,{children:[(0,J.jsxs)(`li`,{children:[(0,J.jsx)(`code`,{children:`Pages/NewDashboard.jsx`}),` rebuilds the board with HTML strings and mounts its own chart functions. The modular React chart path is separate.`]}),(0,J.jsxs)(`li`,{children:[(0,J.jsx)(`code`,{children:`Dashboard/chartRegistry.js`}),` maps several names to generic series/breakdown renderers. Its comments mark live line, scatter, radar and Sankey as not offered by current shape legality.`]}),(0,J.jsxs)(`li`,{children:[(0,J.jsx)(`code`,{children:`MeasureEngine.php`}),` returns `,(0,J.jsx)(`code`,{children:`value`}),` for `,(0,J.jsx)(`code`,{children:`core.revenue`}),` and `,(0,J.jsx)(`code`,{children:`points`}),` for `,(0,J.jsx)(`code`,{children:`core.revenue_trend`}),`. Revenue is read from `,(0,J.jsx)(`code`,{children:`gl.sales_revenue`}),`; payment breakdown is a separate reading.`]}),(0,J.jsxs)(`li`,{children:[(0,J.jsx)(`code`,{children:`Dashboard/charts/kit.jsx → padSeries()`}),` extends sparse series to flat lines. The active page also has scalar-to-series fallbacks. Review both; constant balances and period sales flows require different rules.`]}),(0,J.jsxs)(`li`,{children:
