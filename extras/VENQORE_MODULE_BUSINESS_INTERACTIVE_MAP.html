<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VenQore — System Capability Map</title>
<style>
:root{
  --bg:#f6f8fb; --panel:#fff; --ink:#0f172a; --body:#334155; --muted:#64748b;
  --line:#e2e8f0; --line2:#cbd5e1;
  --brand:#2563eb; --brand-soft:#eff6ff; --brand-line:#bfdbfe;
  --green:#15803d; --green-soft:#f0fdf4; --green-line:#bbf7d0;
  --purple:#7e22ce; --purple-soft:#faf5ff; --purple-line:#e9d5ff;
  --amber:#b45309; --amber-soft:#fffbeb; --amber-line:#fde68a;
  --rose:#be123c; --rose-soft:#fff1f2; --rose-line:#fecdd3;
  --r:12px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--body);line-height:1.5;font-size:14px;
  padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased;
}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
button{font:inherit}

/* ---------------- header ---------------- */
header{
  background:#fff;border-bottom:1px solid var(--line);position:sticky;
  top:0;z-index:50;box-shadow:0 1px 3px rgba(15,23,42,.05);
  padding-top:env(safe-area-inset-top,0px);
}
.hwrap{padding:10px 16px 0}
.brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;
  transition:max-height .18s ease,opacity .18s ease,margin .18s ease;max-height:60px;overflow:hidden}
header.tight .brandrow{max-height:0;opacity:0;margin-bottom:0}
.brand{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.brandsub{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:8px 14px;border:1px solid var(--line);background:#f8fafc;
  border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
  white-space:nowrap;transition:.15s;
}
.tab:hover{border-color:var(--line2);color:var(--body)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}

.pickrow{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px}
.pickrow .fld{flex:1 1 260px;min-width:0;position:relative}
.pickrow input,.pickrow select{
  width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;
  font-size:14px;color:var(--ink);background:#fff;outline:none;
}
.pickrow select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%2364748b' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.pickrow input:focus,.pickrow select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}

/* ---------------- banner ---------------- */
.banner{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px}
.banner h1{font-size:19px;font-weight:700;color:var(--ink);line-height:1.25;letter-spacing:-.01em}
.banner .sub{font-size:13px;color:var(--muted);margin-top:4px}
.chip{display:inline-block;background:#f1f5f9;border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:11.5px;color:var(--body)}
.stats{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stats::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;min-width:104px;background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:10px;padding:8px 12px}
.stat .n{font-size:19px;font-weight:700;color:var(--brand);line-height:1.1}
.stat .l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:3px}
.stat.p{background:var(--purple-soft);border-color:var(--purple-line)}.stat.p .n{color:var(--purple)}
.stat.g{background:var(--green-soft);border-color:var(--green-line)}.stat.g .n{color:var(--green)}
.stat.a{background:var(--amber-soft);border-color:var(--amber-line)}.stat.a .n{color:var(--amber)}

/* ---------------- layout ---------------- */
main{padding:16px}
.grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
/* grid and flex children default to min-width:auto, which lets a wide table
   push the whole column past the viewport. This is the line that stops it. */
.grid>*,.panel,details.grp,.ibody,.bar>*{min-width:0}
@media(min-width:900px){ .grid{grid-template-columns:1fr 1fr} .grid.wide{grid-template-columns:1fr} }
@media(min-width:1500px){ .grid.three{grid-template-columns:1fr 1fr 1fr} }

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.ptitle{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px}
.count{background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700}
.count.p{background:var(--purple-soft);color:var(--purple)}
.count.g{background:var(--green-soft);color:var(--green)}
.pnote{font-size:12px;color:var(--muted);margin:-6px 0 12px}

.stack{display:flex;flex-direction:column;gap:9px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:#f8fafc;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px;color:var(--body);display:inline-flex;align-items:center;gap:5px}
.tag.ok{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.tag.pp{background:var(--purple-soft);border-color:var(--purple-line);color:var(--purple)}
.tag b{font-weight:600}
.tag .s{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.tag.ok .s{color:#4d7c5a}

/* ---------------- card item ---------------- */
.item{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;transition:.15s}
.item:hover{border-color:var(--line2);box-shadow:0 3px 10px rgba(15,23,42,.05)}
.item.click{cursor:pointer}
.item.top{border-color:var(--brand-line);background:linear-gradient(180deg,#fbfdff,#fff)}
.item.sel{border-color:var(--green-line);background:var(--green-soft)}
.irow{display:flex;align-items:flex-start;gap:9px}
.rank{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.rank.dim{background:#e2e8f0;color:var(--muted)}
.ibody{flex:1 1 auto;min-width:0}
.ititle{font-size:13.5px;font-weight:650;color:var(--ink);line-height:1.35}
.imeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pill{font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:5px;text-transform:uppercase;background:#f1f5f9;color:var(--muted);border:1px solid var(--line)}
.pill.stat{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.pill.trend{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.pill.breakdown{background:#faf5ff;color:#7e22ce;border-color:#e9d5ff}
.pill.list{background:#fffbeb;color:#b45309;border-color:#fde68a}
.pill.gauge{background:#fff1f2;color:#be123c;border-color:#fecdd3}
.pill.heatmap{background:#fdf2f8;color:#a21caf;border-color:#f5d0fe}
.pill.status{background:#f1f5f9;color:#475569;border-color:#cbd5e1}
.pill.mod{text-transform:none;letter-spacing:0;font-weight:600;background:#fff;color:var(--muted)}
.pill.per{background:#f8fafc;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600}
.why{margin-top:8px;background:#f8fafc;border-left:3px solid var(--brand);border-radius:0 6px 6px 0;
  padding:8px 10px;font-size:12.5px;color:var(--body);line-height:1.45}
.item.top .why{border-left-color:var(--brand)}

/* ---------------- groups / accordion ---------------- */
details.grp{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
details.grp+details.grp{margin-top:8px}
details.grp>summary{list-style:none;cursor:pointer;padding:10px 12px;background:#f8fafc;
  font-size:13px;font-weight:650;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:hover{background:#f1f5f9}
details.grp>summary .caret{color:var(--muted);font-size:11px;transition:.15s}
details.grp[open]>summary .caret{transform:rotate(90deg)}
details.grp .inner{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}

/* ---------------- bars / tables ---------------- */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(70px,2fr) 34px;gap:9px;align-items:center;font-size:12.5px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--body)}
.bar .tr{background:#eef2f7;border-radius:999px;height:7px;overflow:hidden}
.bar .fi{height:100%;border-radius:999px;background:var(--brand)}
.bar .vl{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bar.lo .fi{background:var(--amber)}
.bar.hi .fi{background:var(--green)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;min-width:440px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:#f8fafc;position:sticky;top:0}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
table.t tr:hover td{background:#f8fafc}
table.t td.wrap{white-space:normal;min-width:220px}

.empty{font-size:13px;color:var(--muted);font-style:italic;padding:10px 0}
.btn{padding:8px 13px;border:1px solid var(--line2);background:#fff;border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--body);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#1d4ed8;color:#fff}
.lede{font-size:13.5px;color:var(--body);line-height:1.6}
.lede+.lede{margin-top:10px}
.lede b{color:var(--ink);font-weight:650}
.rule{height:1px;background:var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--muted);font-weight:600;white-space:nowrap}
.kv dd{color:var(--ink)}
.recipe{display:flex;flex-direction:column;gap:8px}
.recipe .r{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.5}
.recipe .r .k{flex:0 0 auto;width:86px;text-align:center}
textarea.out{width:100%;height:230px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
  border:1px solid var(--line2);border-radius:9px;padding:10px;color:var(--body);background:#f8fafc;resize:vertical}
</style>
</head>

</header>

<div class="banner" id="banner"></div>
<main id="main"></main>

/* ============================== helpers ============================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M = DATA.modules, B = DATA.businesses, C = DATA.cards, P = DATA.presets, E = DATA.engines;
const CORE = DATA.coreCards;

/* A card's score for a given sector = base weight + that sector's boost for the
   card's owning module. Core cards have no module, so they never get boosted. */
function scoreOf(card, sector){
  const boost = (DATA.sectorBoost[sector] || {})[card.module] || 0;
  return card.weight + boost;
}

/* Every card a given module set can show, best first. */
function rankCards(moduleKeys, sector){
  const pool = CORE.map(k => C[k]);
  moduleKeys.forEach(mk => { if (M[mk]) M[mk].cards.forEach(k => pool.push(C[k])); });
  return pool.slice().sort((a, b) => {
    const d = scoreOf(b, sector) - scoreOf(a, sector);
    return d !== 0 ? d : a.title.localeCompare(b.title);
  });
}
const rankCache = {};
function ranked(id, moduleKeys, sector){
  if (!rankCache[id]) rankCache[id] = rankCards(moduleKeys, sector);
  return rankCache[id];
}
const rankedBiz    = k => ranked('b:' + k, B[k].modules, B[k].sector);
const rankedPreset = k => ranked('p:' + k, P[k].modules, P[k].sector);

/* The best twelve — but no more than DATA.moduleCap cards from one module
   (DATA.coreCap from the Qore) and no more than a topic's cap of cards that
   measure nearly the same thing, so a dashboard never opens showing revenue
   three different ways while liquidity and udhaar sit off-screen.
   A second pass relaxes the caps if twelve could not be filled. */
function pickTwelve(rankedList){
  const picked = [], byMod = {}, byTopic = {}, seen = new Set();
  for (let pass = 0; pass < 2 && picked.length < 12; pass++){
    for (const c of rankedList){
      if (picked.length === 12) break;
      if (seen.has(c.key)) continue;
      const mk = c.module || '__core';
      const cap  = mk === '__core' ? DATA.coreCap : DATA.moduleCap;
      const tcap = DATA.topicCap[c.topic] != null ? DATA.topicCap[c.topic] : 99;
      if (pass === 0 && ((byMod[mk] || 0) >= cap || (c.topic && (byTopic[c.topic] || 0) >= tcap))) continue;
      picked.push(c); seen.add(c.key);
      byMod[mk] = (byMod[mk] || 0) + 1;
      if (c.topic) byTopic[c.topic] = (byTopic[c.topic] || 0) + 1;
    }
  }
  return picked;
}
const twelveCache = {};
function twelve(id, rankedList){
  if (!twelveCache[id]) twelveCache[id] = pickTwelve(rankedList);
  return twelveCache[id];
}
const topBiz    = k => twelve('b:' + k, rankedBiz(k));
const topPreset = k => twelve('p:' + k, rankedPreset(k));

/* ---------- eligibility, onboarding, lexicon, streams ---------- */
const forbiddenFor = bk => Object.values(M).filter(m => m.forbidden && m.forbidden.includes(bk));
const eligibleFor  = bk => Object.values(M).filter(m => !(m.forbidden || []).includes(bk));
const probOf = (sector, mk) => DATA.probability[sector + '|' + mk] || 0;

/* The five onboarding questions. Modules the trade can never use are dropped
   outright; the always-on four are provisioned before any question is asked.
   What is left is sorted by how often that trade actually runs it, then cut
   into five even rounds. The AI decides what to SHOW. The owner decides what
   to TAKE — which is the whole point of the change. */
function roundsFor(bk){
  const b = B[bk], on = new Set(b.modules);
  const pool = eligibleFor(bk).filter(m => !m.alwaysOn);
  pool.sort((x, y) => (on.has(y.key) - on.has(x.key))
    || (probOf(b.sector, y.key) - probOf(b.sector, x.key))
    || (x.id - y.id));
  const size = Math.ceil(pool.length / DATA.meta.onboardingRounds), out = [];
  for (let i = 0; i < pool.length; i += size)
    out.push({n: out.length + 1, modules: pool.slice(i, i + size)
      .map(m => ({m, ticked: on.has(m.key), p: probOf(b.sector, m.key)}))});
  return out;
}

  {k:'modules',   t:'Modules'},

  {k:'cards',     t:'Cards'},
  {k:'presets',   t:'Presets'},

           preset:'retail_shop', engine:'ledger', stream:'ledger.journal', q:''};
const PICK_KEY = {modules:'module', businesses:'business', cards:'card', presets:'preset',
                  onboarding:'business', reckoner:'stream', core:'engine'};

/* ============================== chrome ============================== */
function drawTabs(){
  $('tabs').innerHTML = TABS.map(t =>
    `<button class="tab${S.tab === t.k ? ' on' : ''}" data-tab="${t.k}">${t.t}</button>`).join('');
}

function pickerOptions(){
  const t = S.tab, q = S.q.trim().toLowerCase();
  const keep = s => !q || s.toLowerCase().includes(q);
  let groups = [];
  if (t === 'modules'){
    const by = {};
    Object.values(M).forEach(m => {
      const lbl = `#${m.id} ${m.label}`;
      if (keep(lbl + ' ' + m.key + ' ' + m.description)) (by[m.group] = by[m.group] || []).push([m.key, lbl]);
    });
    groups = Object.keys(by).sort().map(g => [`Group ${g} — ${DATA.groups[g]}`, by[g]]);
  } else if (t === 'businesses' || t === 'onboarding'){
    const by = {};
    Object.values(B).forEach(b => {
      if (keep(b.label + ' ' + b.key + ' ' + b.preset_name)) (by[b.sector_name] = by[b.sector_name] || []).push([b.key, b.label]);
    });
    groups = Object.keys(by).sort().map(s => [s, by[s]]);
  } else if (t === 'cards'){
    const by = {};
    Object.values(C).forEach(c => {
      if (keep(c.title + ' ' + c.key + ' ' + c.insight + ' ' + c.moduleLabel)) (by[c.domain] = by[c.domain] || []).push([c.key, c.title]);
    });
    groups = Object.keys(by).sort((a,b) => (a === 'The Qore' ? -1 : b === 'The Qore' ? 1 : a.localeCompare(b)))
                   .map(d => [d, by[d].sort((x,y) => x[1].localeCompare(y[1]))]);
  } else if (t === 'presets'){
    const by = {};
    Object.values(P).forEach(p => {
      if (keep(p.name + ' ' + p.key)) (by[p.sector_name] = by[p.sector_name] || []).push([p.key, `${p.name} (${p.businesses.length})`]);
    });
    groups = Object.keys(by).sort().map(s => [s, by[s]]);
  } else if (t === 'reckoner'){
    groups = [['The 16 streams the Reckoner keeps hot',
      Object.values(DATA.streams).filter(x => keep(x.name + ' ' + x.key + ' ' + x.what))
        .map(x => [x.key, `${x.name} — ${x.cards} cards`])]];
  } else if (t === 'core'){
    groups = [['The Qore — 13 always-on engines',
      Object.values(E).filter(e => keep(e.title + ' ' + e.does)).map(e => [e.key, e.title])]];
  }
  return groups;
}

function drawPicker(){
  const t = S.tab, row = $('pickrow');
  if (t === 'overview' || t === 'export'){ row.style.display = 'none'; return; }
  row.style.display = '';
  const key = PICK_KEY[t];
  const groups = pickerOptions();
  const flat = groups.flatMap(g => g[1]);
  if (flat.length && !flat.some(o => o[0] === S[key])) S[key] = flat[0][0];
  $('sel').innerHTML = groups.length
    ? groups.map(([label, opts]) => `<optgroup label="${esc(label)}">` +
        opts.map(([v, l]) => `<option value="${esc(v)}"${v === S[key] ? ' selected' : ''}>${esc(l)}</option>`).join('') +
        `</optgroup>`).join('')
    : `<option value="">No match</option>`;
  $('q').placeholder = {modules:'Search 46 modules…', businesses:'Search 85 business types…',
    cards:'Search 349 cards…', presets:'Search 20 presets…', core:'Search 13 engines…',
    onboarding:'Search 85 business types…', reckoner:'Search 16 streams…'}[t] || 'Search…';
}

function banner(title, sub, stats){
  $('banner').innerHTML = `<h1>${title}</h1>` + (sub ? `<div class="sub">${sub}</div>` : '') +
    (stats && stats.length ? `<div class="stats">${stats.map(s =>
      `<div class="stat ${s[2] || ''}"><div class="n">${s[0]}</div><div class="l">${esc(s[1])}</div></div>`).join('')}</div>` : '');
}

/* ============================== card rendering ============================== */
function cardItem(c, opts){
  opts = opts || {};
  const rank = opts.rank ? `<div class="rank${opts.dim ? ' dim' : ''}">${opts.rank}</div>` : '';
  const cls = 'item click' + (opts.top ? ' top' : '') + (opts.sel ? ' sel' : '');
  return `<div class="${cls}" data-card="${esc(c.key)}">
    <div class="irow">${rank}<div class="ibody">
      <div class="ititle">${esc(c.title)}</div>
      <div class="imeta">
        <span class="pill ${c.viz}">${c.viz}</span>
        <span class="pill mod">${esc(c.module ? c.moduleLabel : 'Qore — always on')}</span>
        ${c.period ? '<span class="pill per">period-aware</span>' : ''}
      </div>
      <div class="why">${esc(c.insight)}</div>
    </div></div></div>`;
}

function cardsByModule(list, title, note){
  const by = {};
  list.forEach(c => { const k = c.module || '__core'; (by[k] = by[k] || []).push(c); });
  const order = Object.keys(by).sort((a, b) =>
    a === '__core' ? -1 : b === '__core' ? 1 : (M[a].id - M[b].id));
  return `<div class="panel">
    <div class="phead"><div class="ptitle">🗂️ ${title}</div><span class="count">${list.length} cards</span></div>
    ${note ? `<div class="pnote">${note}</div>` : ''}
    ${order.map(k => {
      const label = k === '__core' ? '🔒 The Qore — always on' : `#${M[k].id} ${M[k].label}`;
      return `<details class="grp"><summary><span>${esc(label)}</span>
        <span><span class="count">${by[k].length}</span> <span class="caret">▸</span></span></summary>
        <div class="inner">${by[k].map(c => cardItem(c)).join('')}</div></details>`;
    }).join('')}
  </div>`;
}

        <button class="btn pri" data-export="presets">Copy</button></div>
      <div class="pnote">Per preset: the modules it enables, and its ordered default 12 card keys.</div>
      <textarea class="out" id="out-presets" readonly></textarea>
    </div>
    <div class="panel">
      <div class="phead"><div class="ptitle">📤 Business defaults</div>
        <button class="btn pri" data-export="businesses">Copy</button></div>
      <div class="pnote">Per business type: sector, preset, module list, and its ordered default 12.</div>
      <textarea class="out" id="out-businesses" readonly></textarea>
    </div>
    <div class="panel">
      <div class="phead"><div class="ptitle">📤 Card catalogue</div>
        <button class="btn pri" data-export="cards">Copy</button></div>
      <div class="pnote">All ${DATA.meta.cards} cards: key, title, shape, owning module, period-awareness, weight, owner-facing line.</div>
      <textarea class="out" id="out-cards" readonly></textarea>
    </div>
    <div class="panel">
      <div class="phead"><div class="ptitle">📤 Module → cards</div>
        <button class="btn pri" data-export="modules">Copy</button></div>
      <div class="pnote">Per module: the card keys it unlocks, the businesses it is on for, its prerequisites, and the businesses it must never be offered to.</div>
      <textarea class="out" id="out-modules" readonly></textarea>
    </div>
    <div class="panel">
      <div class="phead"><div class="ptitle">📤 Onboarding rounds</div>
        <button class="btn pri" data-export="onboarding">Copy</button></div>
      <div class="pnote">Per business: always-on modules, the five rounds with pre-tick state and sector probability, and the never-offer list.</div>
      <textarea class="out" id="out-onboarding" readonly></textarea>
    </div>
    <div class="panel">
      <div class="phead"><div class="ptitle">📤 Lexicon</div>
        <button class="btn pri" data-export="lexicon">Copy</button></div>
      <div class="pnote">Resolved term map per business — sector base with the trade's own overrides already merged.</div>
      <textarea class="out" id="out-lexicon" readonly></textarea>
    </div>
    <div class="panel">
      <div class="phead"><div class="ptitle">📤 Reckoner contract</div>
        <button class="btn pri" data-export="reckoner">Copy</button></div>
      <div class="pnote">Streams, the reading envelope, the invariant set, and every card's stream dependencies.</div>
      <textarea class="out" id="out-reckoner" readonly></textarea>
    </div>
  </div>`;
  fill('presets', Object.fromEntries(Object.values(P).map(p => [p.key,
    {name:p.name, sector:p.sector, modules:p.modules, default12: topPreset(p.key).map(c=>c.key), available: rankedPreset(p.key).length}])));
  fill('businesses', Object.fromEntries(Object.values(B).map(b => [b.key,
    {label:b.label, sector:b.sector, preset:b.preset, modules:b.modules, default12: topBiz(b.key).map(c=>c.key), available: rankedBiz(b.key).length}])));
  fill('cards', Object.fromEntries(Object.values(C).map(c => [c.key,
    {title:c.title, viz:c.viz, module:c.module || null, period:c.period, weight:c.weight, insight:c.insight}])));
  fill('modules', Object.fromEntries(Object.values(M).map(m => [m.key,
    {id:m.id, label:m.label, group:m.group, alwaysOn:!!m.alwaysOn, needs:m.needs||[],
     needsAny:m.needsAny||[], why:m.why||null, cards:m.cards, businesses:m.businesses,
     neverOfferTo:m.forbidden||[]}])));
  fill('onboarding', Object.fromEntries(Object.values(B).map(b => [b.key, {
    alwaysOn: DATA.alwaysOn,
    neverOffer: forbiddenFor(b.key).map(m => ({module:m.key, why:m.why})),
    rounds: rounds(b.key).map(r => ({round:r.n, modules:r.modules.map(x =>
      ({module:x.m.key, label:x.m.label, blurb:x.m.description, preTicked:x.ticked,
        sectorProbability:x.p, needs:x.m.needs||[], needsAny:x.m.needsAny||[]}))}))
  }])));
  fill('lexicon', Object.fromEntries(Object.values(B).map(b => [b.key, lexiconFor(b.key)])));
  fill('reckoner', {
    streams: DATA.streams, coreStreams: DATA.coreStreams,
    envelope: DATA.envelope, invariants: DATA.invariants,
    cardStreams: Object.fromEntries(Object.values(C).map(c => [c.key, streamsOf(c)]))
  });
}
function fill(id, obj){ const el = $('out-' + id); if (el) el.value = JSON.stringify(obj, null, 2); }


/* ============================== onboarding ============================== */
function viewOnboarding(){
  const b = B[S.business]; if (!b) return;
  const rds = rounds(b.key), forb = forbiddenFor(b.key), lex = lexiconFor(b.key);
  const always = DATA.alwaysOn.map(k => M[k]);
  const preTicked = rds.flatMap(r => r.modules).filter(x => x.ticked).length;

  banner(esc(b.label) + ' <span style="font-size:13px;font-weight:500;color:var(--muted)">onboarding</span>',
    `<span class="chip">${esc(b.sector_name)}</span> <span class="chip">matched preset: <b>${esc(b.preset_name)}</b></span>`,
    [[always.length, 'Given, not asked', 'g'], [b.offered, 'Offered across 5 rounds'],
     [forb.length, 'Never offered', 'a'], [preTicked + always.length, 'Pre-ticked total', 'p']]);

  // group the never-offer list by the reason, so it reads as rules not noise
  const byWhy = {};
  forb.forEach(m => { (byWhy[m.why || 'Not applicable to this trade'] ||= []).push(m); });

  $('main').innerHTML = `<div class="grid">
    <div>
      <div class="panel" style="margin-bottom:16px">
        <div class="phead"><div class="ptitle">🧭 How this flow works</div></div>
        <div class="lede">The AI's job is to decide <b>what to show</b>. The owner's job is to decide <b>what to take</b>. That split is what removes the ambiguity — nobody has to trust a model's guess about their business, they just tick what they recognise.</div>
        <div class="rule"></div>
        <div class="recipe">
          <div class="r"><span class="k pill status">1</span><span>Owner describes the business in their own words. We match it to one of the 85 types.</span></div>
          <div class="r"><span class="k pill status">2</span><span><b>${always.length} modules are provisioned silently</b> — no business runs without them, so asking is wasted attention.</span></div>
          <div class="r"><span class="k pill status">3</span><span><b>${forb.length} modules are removed from the flow entirely</b>, because this trade can never use them. They are never shown, never explained, never a decision.</span></div>
          <div class="r"><span class="k pill status">4</span><span>The remaining <b>${b.offered}</b> are cut into <b>5 rounds</b> by how often this trade actually runs them. Each is one heading and one plain line. The ones the preset expects arrive pre-ticked.</span></div>
          <div class="r"><span class="k pill status">5</span><span>A review screen shows the cart. Then we provision, apply the lexicon below, and seed the dashboard.</span></div>
        </div>
      </div>

      <div class="panel">
        <div class="phead"><div class="ptitle">🔒 Given before the first question</div><span class="count g">${always.length}</span></div>
        <div class="pnote">Not optional, so not a question. Every tenant gets these the moment the account exists.</div>
        <div class="tags">${always.map(m => `<span class="tag ok click" data-mod="${esc(m.key)}"><b>#${m.id} ${esc(m.label)}</b></span>`).join('')}</div>
        <div class="rule"></div>
        <div class="ptitle" style="margin-bottom:10px">🚫 Never offered to this trade <span class="count a">${forb.length}</span></div>
        <div class="pnote">This is the new rule set. A module here is not hidden behind an "advanced" toggle — it is absent, because offering it would be asking the owner to judge something meaningless.</div>
        ${Object.keys(byWhy).length ? Object.entries(byWhy).map(([why, list]) => `
          <div style="margin-bottom:12px">
            <div class="tags" style="margin-bottom:6px">${list.map(m => `<span class="tag pp click" data-mod="${esc(m.key)}"><b>#${m.id} ${esc(m.label)}</b></span>`).join('')}</div>
            <div class="why" style="border-left-color:var(--amber)">${esc(why)}</div>
          </div>`).join('')
        : `<div class="empty">Nothing is off the table for this trade — all 46 modules are offerable.</div>`}
      </div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:16px">
        <div class="phead"><div class="ptitle">❓ The five questions</div><span class="count">${b.offered} modules</span></div>
        <div class="pnote">Ordered by how many businesses in <b>${esc(b.sector_name.split(',')[0])}</b> actually run each one. Pre-ticked means the preset expects it; the owner can untick anything.</div>
        ${rds.map(r => `<details class="grp"${r.n === 1 ? ' open' : ''}><summary>
            <span>Round ${r.n} — ${r.modules.filter(x => x.ticked).length} pre-ticked of ${r.modules.length}</span>
            <span><span class="count">${r.modules.length}</span> <span class="caret">▸</span></span></summary>
          <div class="inner">${r.modules.map(x => `
            <div class="item click${x.ticked ? ' sel' : ''}" data-mod="${esc(x.m.key)}">
              <div class="irow">
                <div class="rank${x.ticked ? '' : ' dim'}" style="${x.ticked ? 'background:var(--green)' : ''}">${x.ticked ? '✓' : ''}</div>
                <div class="ibody">
                  <div class="ititle">${esc(x.m.label)}</div>
                  <div class="imeta">
                    <span class="pill mod">Group ${x.m.group}</span>
                    <span class="pill per">${x.p}% of this sector</span>
                    <span class="pill mod">+${x.m.cardCount} cards</span>
                    ${(x.m.needs || []).length ? `<span class="pill gauge">needs ${x.m.needs.map(k => esc(M[k].label)).join(' + ')}</span>` : ''}
                    ${(x.m.needsAny || []).length ? `<span class="pill gauge">needs ${x.m.needsAny.map(k => esc(M[k].label)).join(' or ')}</span>` : ''}
                  </div>
                  <div class="why">${esc(x.m.description)}</div>
                </div>
              </div>
            </div>`).join('')}</div></details>`).join('')}
      </div>

      <div class="panel">
        <div class="phead"><div class="ptitle">🏷️ What the software calls things</div>
          <span class="count p">${Object.keys(b.lex || {}).length} overrides</span></div>
        <div class="pnote">Applied at render time from one map, not by renaming anything in the schema. A highlighted row is where this trade's own word beats the sector default.</div>
        <div class="scroll"><table class="t">
          <thead><tr><th>System concept</th><th>${esc(b.sector_name.split(',')[0])} default</th><th>This trade says</th></tr></thead>
          <tbody>${DATA.lexiconFields.map(f => {
            const base = DATA.lexiconSector[b.sector][f], mine = lex[f];
            const over = (b.lex || {})[f] != null;
            return `<tr${over ? ' style="background:var(--green-soft)"' : ''}>
              <td><code>${esc(f)}</code></td><td>${esc(base)}</td>
              <td class="${over ? '' : 'num'}" style="${over ? 'font-weight:700;color:var(--green)' : 'color:var(--muted);font-weight:400;text-align:left'}">${esc(mine)}</td></tr>`;
          }).join('')}</tbody></table></div>
      </div>
    </div>
  </div>`;
}

/* ============================== reckoner ============================== */
function viewReckoner(){
  const sk = S.stream, st = DATA.streams[sk]; if (!st) return;
  const cards = cardsOnStream(sk);
  const streams = Object.values(DATA.streams).sort((a, b) => b.cards - a.cards);
  const maxS = streams[0].cards;
  const byKind = {};
  DATA.invariants.forEach(i => { (byKind[i.kind] ||= []).push(i); });
  const kindLabel = {ledger:'Tied to the books', internal:'Card against card', shape:'Structural — any card of that shape'};

  banner('The Reckoner contract',
    `<span class="chip">${DATA.meta.cards} cards</span> <span class="chip">${DATA.meta.streams} streams</span> <span class="chip">${DATA.meta.invariants} invariants</span> — a card never queries a table. It asks for a measure, and every measure is a projection of these streams.`,
    [[DATA.meta.cards, 'Cards to serve', 'p'], [DATA.meta.streams, 'Streams to keep hot', 'g'],
     [DATA.meta.invariants, 'Invariants', 'a'], [DATA.envelope.length, 'Envelope fields']]);

  $('main').innerHTML = `<div class="grid">
    <div>
      <div class="panel" style="margin-bottom:16px">
        <div class="phead"><div class="ptitle">🧮 Why ${DATA.meta.cards} cards is not ${DATA.meta.cards} queries</div></div>
        <div class="lede">Materialising every card independently would mean ${DATA.meta.cards} resolvers per tenant per refresh, each its own chance to be wrong or blank. That is the shape of the bug you have now.</div>
        <div class="lede">The cards are not independent. They are <b>${DATA.meta.streams} streams</b> projected into <b>6 shapes</b>. Get a stream right and every card reading it is right. Get one wrong and you know exactly which cards to distrust — which is what the panel on the right is for.</div>
        <div class="rule"></div>
        <div class="ptitle" style="margin-bottom:10px">Cards depending on each stream</div>
        <div class="bars">${streams.map(x =>
          `<div class="bar ${x.key === sk ? 'hi' : ''} click" data-stream="${esc(x.key)}" style="cursor:pointer">
            <div class="nm">${esc(x.name)}</div>
            <div class="tr"><div class="fi" style="width:${Math.max(4, Math.round(x.cards / maxS * 100))}%"></div></div>
            <div class="vl">${x.cards}</div></div>`).join('')}</div>
        <div class="pnote" style="margin-top:10px">Counts overlap — most cards read two or three streams.</div>
      </div>

      <div class="panel">
        <div class="phead"><div class="ptitle">📦 Every reading comes back in this envelope</div><span class="count">${DATA.envelope.length} fields</span></div>
        <div class="pnote">A resolver may never return a bare number, a null, or nothing. This is the change that turns a blank card into a legible one.</div>
        <div class="scroll"><table class="t">
          <thead><tr><th>Field</th><th>Type</th><th>Why it exists</th></tr></thead>
          <tbody>${DATA.envelope.map(e => `<tr>
            <td><code>${esc(e.field)}</code></td><td style="color:var(--muted)">${esc(e.type)}</td>
            <td class="wrap">${esc(e.note)}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:16px">
        <div class="phead"><div class="ptitle">🔗 ${esc(st.name)}</div><span class="count p">${cards.length} cards</span></div>
        <div class="why" style="margin-bottom:12px">${esc(st.what)}</div>
        <div class="pnote">If this stream stops or drifts, these are the cards that go wrong — and the only ones. That is the whole point of routing every card through a stream.</div>
        ${cardsByModule(cards, 'Cards fed by ' + st.name, '')}
      </div>

      <div class="panel">
        <div class="phead"><div class="ptitle">🛡️ Gates that keep it honest</div><span class="count g">${DATA.invariants.length}</span></div>
        <div class="pnote">The ledger proves itself because debits must equal credits. The Reckoner needs the same kind of proof, or every number is just a hopeful query. Each of these is a statement that must hold, asserted in CI and sampled in production.</div>
        ${['ledger','internal','shape'].map(k => byKind[k] ? `
          <details class="grp" open><summary><span>${esc(kindLabel[k])}</span>
            <span><span class="count">${byKind[k].length}</span> <span class="caret">▸</span></span></summary>
            <div class="inner">${byKind[k].map(i => `<div class="item">
              <div class="ititle">${esc(i.rule)}</div>
              <div class="imeta"><span class="pill ${k === 'ledger' ? 'trend' : k === 'internal' ? 'stat' : 'breakdown'}">${esc(i.key)}</span></div>
              <div class="why">${esc(i.note)}</div></div>`).join('')}</div></details>` : '').join('')}
      </div>
    </div>
  </div>`;
}

/* ============================== render ============================== */
function render(keepScroll){
  drawTabs(); drawPicker();
  $('brandsub').textContent = `${DATA.meta.modules} modules · ${DATA.meta.businesses} businesses · ${DATA.meta.cards} cards · ${DATA.meta.engines} Qore engines`;
  ({overview:viewOverview, modules:viewModule, businesses:viewBusiness, cards:viewCard,
    presets:viewPreset, onboarding:viewOnboarding, reckoner:viewReckoner,
    core:viewCore, export:viewExport}[S.tab])();
  if (!keepScroll) window.scrollTo(0, 0);
}

/* ============================== events ============================== */
document.addEventListener('click', ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab){ S.tab = tab.dataset.tab; S.q = ''; $('q').value = ''; render(); return; }
  const go = (t, k, v) => { S.tab = t; S[k] = v; S.q = ''; $('q').value = ''; render(); };
  const c = ev.target.closest('[data-card]');  if (c) return go('cards', 'card', c.dataset.card);
  const b = ev.target.closest('[data-biz]');   if (b) return go('businesses', 'business', b.dataset.biz);
  const m = ev.target.closest('[data-mod]');   if (m) return go('modules', 'module', m.dataset.mod);
  const e = ev.target.closest('[data-eng]');   if (e) return go('core', 'engine', e.dataset.eng);
  const st = ev.target.closest('[data-stream]'); if (st) return go('reckoner', 'stream', st.dataset.stream);
  const x = ev.target.closest('[data-export]');
  if (x){ const el = $('out-' + x.dataset.export); el.select(); el.setSelectionRange(0, 99999999);
    try { document.execCommand('copy'); x.textContent = 'Copied'; setTimeout(() => x.textContent = 'Copy', 1400); } catch(_){} }
});
$('sel').addEventListener('change', e => { S[PICK_KEY[S.tab]] = e.target.value; render(); });
let qt; $('q').addEventListener('input', e => { S.q = e.target.value; clearTimeout(qt); qt = setTimeout(() => { render(true); }, 160); });

/* On a phone the header is most of the screen. Fold the brand line away once the
   page scrolls so the tabs and the picker stay reachable without eating the view. */
let tight = false;
addEventListener('scroll', () => {
  const want = scrollY > 40;
  if (want !== tight){ tight = want; document.querySelector('header').classList.toggle('tight', want); }
}, {passive:true});

render();
</script>
</body>
</html>
